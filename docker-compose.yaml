services:
  nachet-db:
    container_name: nachet-db
    image: postgres:18-bookworm
    env_file:
      - ./db/.env.config.local
    ports:
      - "12432:5432"
    volumes:
      - ./db/postgres-data/data:/var/lib/postgresql
    # network_mode: bridge
    networks:
      - nachet-local-network

  nachet-pgadmin:
    container_name: nachet-pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on:
      - nachet-db
    env_file:
      - ./db/.env.config.local
    volumes:
      - ./db/pgadmin-data/data:/var/lib/pgadmin
    ports:
      - "12433:80"
    networks:
      - nachet-local-network

  nachet-blob:
    container_name: nachet-blob
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    hostname: azurite
    restart: always
    # command: "azurite --blobHost 127.0.0.1 --blobPort 10000 --queueHost 127.0.0.1 --queuePort 10001"
    command: "azurite --loose --blobHost 0.0.0.0 --blobPort 10000 --location /workspace --debug /workspace/debug.log"
    volumes:
      - ./blob/azurite/data:/workspace
    ports:
      - "12434:10000"
    # network_mode: bridge
    networks:
      - nachet-local-network

  nachet-backend:
    container_name: nachet-backend

    # uncomment these to build backend from source
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    image: local/nachet-backend:latest

    # uncomment these to use prebuilt image from ghcr
    # image: ghcr.io/ai-cfia/nachet-backend:1.0.4
    command: ["uv", "run", "hypercorn", "-b", ":5174", "app/main:app"]
    env_file:
      # - ./nachet-backend/.env.secrets.local
      # - ./nachet-backend/.env.config.local
      - ./backend/.env.container.local
    ports:
      - "12435:5174"
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - nachet-db
      - nachet-blob
    # network_mode: bridge
    networks:
      - nachet-local-network

  # optional frontend service, uncomment to use
  # for debugging dev build
  # nachet-frontend:
  #   container_name: nachet-frontend

  #   # uncomment these to build frontend from source
  #   build:
