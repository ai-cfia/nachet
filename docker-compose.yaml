  #######################################################################################
  # Observability Stack - Grafana Alloy, Loki, Grafana
  #######################################################################################

  loki:
    container_name: nachet-loki
    image: grafana/loki:3.6.2
    ports:
      - "12310:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-data:/loki
    networks:
      - nachet-local-network

  alloy:
    container_name: nachet-alloy
    image: grafana/alloy:v1.11.3
    ports:
      - "12317:4317" # OTLP gRPC receiver
      - "12318:4318" # OTLP HTTP receiver
      - "12345:12345" # Alloy UI
    volumes:
      - ./observability/alloy-config.yaml:/etc/alloy/config.alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - loki
    networks:
      - nachet-local-network

  grafana:
    container_name: nachet-grafana
    image: grafana/grafana:12.3.0
    ports:
      - "12300:3000"
    env_file:
      - ./observability/.env.local
    volumes:
      - ./observability/grafana-data:/var/lib/grafana
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./observability/grafana-dashboards-provisioning.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./observability/grafana-dashboard-nachet.json:/etc/grafana/provisioning/dashboards/grafana-dashboard-nachet.json
    depends_on:
      - loki
    networks:
      - nachet-local-network

  #######################################################################################
  # S3 compatible storage options
  #######################################################################################

  # Garage S3 compatible storage
  nachet-op-blob:
    image: dxflrs/garage:v2.1.0
    container_name: nachet-op-blob
    restart: unless-stopped
    environment:
      - RUST_LOG=garage=debug
    ports:
      - "12440:12440"
      - "12441:12441"
      # - "12442:12442"
      - "12443:12443"
      # - "12444:12444"
    volumes:
      - ./blob/garage/garage.toml.local:/etc/garage.toml
      - ./blob/garage/meta:/var/lib/garage/meta
      - ./blob/garage/data:/var/lib/garage/data
    networks:
      - nachet-local-network

  nachet-op-blob-webui:
    image: khairul169/garage-webui:latest
    container_name: nachet-op-blob-webui
    restart: unless-stopped
    volumes:
      - ./blob/garage/garage.toml.local:/etc/garage.toml:ro
    ports:
      - 3909:3909
    environment:
      API_BASE_URL: "http://nachet-op-blob:12443"
      S3_ENDPOINT_URL: "http://nachet-op-blob:12440"
    extra_hosts:
     - "host.docker.internal:host-gateway"
    depends_on:
      - nachet-op-blob
    networks:
      - nachet-local-network

