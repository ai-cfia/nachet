trigger:
  tags:
    include:
      - v*

pr: none

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: nachet-dev

stages:
  - stage: InitAndPlan
    displayName: "Initialize and Plan"
    jobs:
      - job: TerraformInitPlan
        displayName: "Terraform Init and Plan"
        steps:
          - task: AzureCLI@2
            displayName: "Azure CLI Login"
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                echo "Successfully logged in with Azure CLI"

          - task: DownloadSecureFile@1
            name: DownloadSecureVars
            displayName: "Download nachet-dev.tfvars"
            inputs:
              secureFile: "nachet-dev.tfvars"

          - task: AzureCLI@2
            displayName: "Pre-create PostgreSQL Subnet"
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                SUBNET_NAME="$(postgresqlSubnetName)"
                VNET_NAME="$(vnetName)"
                VNET_RG="$(vnetResourceGroupName)"
                SUBNET_CIDR="$(postgresqlSubnetCidr)"
                ROUTE_TABLE_ID="$(routeTableId)"
                NSG_ID="$(networkSecurityGroupId)"
                
                echo "Checking if PostgreSQL subnet exists..."
                if az network vnet subnet show \
                  --resource-group "$VNET_RG" \
                  --vnet-name "$VNET_NAME" \
                  --name "$SUBNET_NAME" \
                  --query "id" -o tsv 2>/dev/null; then
                  
                  echo "✓ Subnet '$SUBNET_NAME' already exists"
                else
                  echo "Creating PostgreSQL subnet with route table and NSG..."
                  az network vnet subnet create \
                    --resource-group "$VNET_RG" \
                    --vnet-name "$VNET_NAME" \
                    --name "$SUBNET_NAME" \
                    --address-prefixes "$SUBNET_CIDR" \
                    --route-table "$ROUTE_TABLE_ID" \
                    --network-security-group "$NSG_ID" \
                    --service-endpoints Microsoft.Storage \
                    --delegations Microsoft.DBforPostgreSQL/flexibleServers \
                    --output table
                    
                  if [ $? -eq 0 ]; then
                    echo "✓ Successfully created subnet '$SUBNET_NAME' with route table"
                  else
                    echo "✗ Failed to create subnet"
                    exit 1
                  fi
                fi

          - task: AzureCLI@2
            displayName: "Pre-create Container Apps Subnet"
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                VNET_NAME="$(vnetName)"
                VNET_RG="$(vnetResourceGroupName)"
                ROUTE_TABLE_ID="$(routeTableId)"
                NSG_ID="$(networkSecurityGroupId)"
                CONTAINER_SUBNET_NAME="$(containerAppsSubnetName)"
                CONTAINER_SUBNET_CIDR="$(containerAppsSubnetCidr)"
                
                echo "Checking if Container Apps subnet exists..."
                if az network vnet subnet show \
                  --resource-group "$VNET_RG" \
                  --vnet-name "$VNET_NAME" \
                  --name "$CONTAINER_SUBNET_NAME" \
                  --query "id" -o tsv 2>/dev/null; then
                  
                  echo "✓ Subnet '$CONTAINER_SUBNET_NAME' already exists"
                  echo "Ensuring subnet delegation to Microsoft.App/environments..."
                  az network vnet subnet update \
                    --resource-group "$VNET_RG" \
                    --vnet-name "$VNET_NAME" \
                    --name "$CONTAINER_SUBNET_NAME" \
                    --delegations "Microsoft.App/environments" \
                    --output table
                else
                  echo "Creating Container Apps subnet..."
                  az network vnet subnet create \
                    --resource-group "$VNET_RG" \
                    --vnet-name "$VNET_NAME" \
                    --name "$CONTAINER_SUBNET_NAME" \
                    --address-prefixes "$CONTAINER_SUBNET_CIDR" \
                    --route-table "$ROUTE_TABLE_ID" \
                    --network-security-group "$NSG_ID" \
                    --delegations "Microsoft.App/environments" \
                    --output table
                    
                  if [ $? -eq 0 ]; then
                    echo "✓ Successfully created Container Apps subnet"
                  else
                    echo "✗ Failed to create Container Apps subnet"
                    exit 1
                  fi
                fi

          - task: AzureCLI@2
            displayName: "Create PostgreSQL Flexible Server"
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                SERVER_NAME="$(postgresqlServerName)"
                RESOURCE_GROUP="$(resourceGroupName)"
                LOCATION="$(location)"
                VNET_NAME="$(vnetName)"
                SUBNET_NAME="$(postgresqlSubnetName)"
                VNET_RG="$(vnetResourceGroupName)"
                ADMIN_USERNAME="$(postgresqlAdminUsername)"
                ADMIN_PASSWORD="$(postgresqlAdminPassword)"
                
                echo "Checking if PostgreSQL server exists..."
                if az postgres flexible-server show \
                  --resource-group "$RESOURCE_GROUP" \
                  --name "$SERVER_NAME" \
                  --query "name" -o tsv 2>/dev/null; then
                  
                  echo "✓ PostgreSQL server '$SERVER_NAME' already exists"
                else
                  echo "Creating PostgreSQL Flexible Server..."
                  az postgres flexible-server create \
                    --resource-group "$RESOURCE_GROUP" \
                    --location "$LOCATION" \
                    --name "$SERVER_NAME" \
                    --admin-user "$ADMIN_USERNAME" \
                    --admin-password "$ADMIN_PASSWORD" \
                    --version "17" \
                    --sku-name "Standard_B1ms" \
                    --storage-size 32 \
                    --storage-tier "P4" \
                    --tier "Burstable" \
                    --backup-retention 7 \
                    --zone 1 \
                    --vnet "$VNET_NAME" \
                    --subnet "$SUBNET_NAME" \
                    --vnet-resource-group "$VNET_RG" \
                    --yes
                    
                  if [ $? -eq 0 ]; then
                    echo "✓ Successfully created PostgreSQL server '$SERVER_NAME'"
                  else
                    echo "✗ Failed to create PostgreSQL server"
                    exit 1
                  fi
                fi
                
                echo "Configuring PostgreSQL extensions..."
                az postgres flexible-server parameter set \
                  --resource-group "$RESOURCE_GROUP" \
                  --server-name "$SERVER_NAME" \
                  --name "azure.extensions" \
                  --value "PGCRYPTO,UUID-OSSP"
                  
                echo "Creating nachet_db database..."
                az postgres flexible-server db create \
                  --resource-group "$RESOURCE_GROUP" \
                  --server-name "$SERVER_NAME" \
                  --database-name "nachet_db" \
                  --charset "utf8" \
                  --collation "en_US.utf8" \
                  --output table || echo "Database may already exist"

          - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
            displayName: "Install Terraform (latest)"
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(System.DefaultWorkingDirectory)/terraform/dev"
              backendServiceArm: "$(serviceConnectionName)"
              backendAzureRmResourceGroupName: "$(resourceGroupName)"
              backendAzureRmStorageAccountName: "$(storageAccountName)"
              backendAzureRmContainerName: "$(containerName)"
              backendAzureRmKey: "$(stateKey)"

          - task: TerraformTask@5
            displayName: "Terraform Plan"
            inputs:
              provider: "azurerm"
              command: "plan"
              commandOptions: "-var-file=$(DownloadSecureVars.SecureFilePath)"
              workingDirectory: "$(System.DefaultWorkingDirectory)/terraform/dev"
              environmentServiceNameAzureRM: "$(serviceConnectionName)"

  - stage: Apply
    displayName: "Apply Terraform Plan"
    dependsOn: InitAndPlan
    condition: succeeded()
    jobs:
      - deployment: TerraformApply
        displayName: "Terraform Apply"
        pool:
          vmImage: "ubuntu-latest"
        environment: "TFApproval"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: "Azure CLI Login"
                  inputs:
                    azureSubscription: $(serviceConnectionName)
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      echo "Successfully logged in with Azure CLI"

                - task: DownloadSecureFile@1
                  name: DownloadSecureVars
                  displayName: "Download nachet-dev.tfvars"
                  inputs:
                    secureFile: "nachet-dev.tfvars"

                - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
                  displayName: "Install Terraform (latest)"
                  inputs:
                    terraformVersion: 'latest'

                - task: TerraformTask@5
                  displayName: "Terraform Init"
                  inputs:
                    provider: "azurerm"
                    command: "init"
                    workingDirectory: "$(System.DefaultWorkingDirectory)/terraform/dev"
                    backendServiceArm: "$(serviceConnectionName)"
                    backendAzureRmResourceGroupName: "$(resourceGroupName)"
                    backendAzureRmStorageAccountName: "$(storageAccountName)"
                    backendAzureRmContainerName: "$(containerName)"
                    backendAzureRmKey: "$(stateKey)"

                - task: TerraformTask@5
                  displayName: "Terraform Apply"
                  inputs:
                    provider: "azurerm"
                    command: "apply"
                    commandOptions: "-var-file=$(DownloadSecureVars.SecureFilePath)"
                    workingDirectory: "$(System.DefaultWorkingDirectory)/terraform/dev"
                    environmentServiceNameAzureRM: "$(serviceConnectionName)"
