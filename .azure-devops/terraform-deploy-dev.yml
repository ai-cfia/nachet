trigger:
  tags:
    include:
      - v*

pr: none

pool:
  name: linux-internal-vmss-agent

variables:
  - group: nachet-dev

stages:
  - stage: InitAndPlan
    displayName: "Initialize and Plan"
    jobs:
      - job: TerraformInitPlan
        displayName: "Terraform Init and Plan"
        steps:
          - checkout: self

          - task: Bash@3
            displayName: "Check Agent Public IP"
            inputs:
              targetType: 'inline'
              script: |
                echo "Agent public IP address:"
                curl -s ifconfig.me
                echo ""
        
          - task: DownloadSecureFile@1
            name: DownloadSecureVars
            displayName: "Download nachet-dev.tfvars"
            inputs:
              secureFile: "nachet-dev.tfvars"

          - task: AzureCLI@2
            displayName: "Terraform Init and Plan with OIDC"
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |                
                # Export ARM variables for Terraform Service Principal authentication
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                
                # For OIDC/Workload Identity Federation (no client secret needed)
                export ARM_USE_OIDC=true
                export ARM_OIDC_REQUEST_TOKEN="$SYSTEM_ACCESSTOKEN"
                export ARM_OIDC_REQUEST_URL="$SYSTEM_OIDCREQUESTURI"
                
                # Alternative: Use Azure CLI authentication (if OIDC fails)
                export ARM_USE_CLI=true
                
                echo "ARM variables exported for Terraform OIDC:"
                echo "  ARM_CLIENT_ID: $ARM_CLIENT_ID"
                echo "  ARM_TENANT_ID: $ARM_TENANT_ID"
                echo "  ARM_SUBSCRIPTION_ID: $ARM_SUBSCRIPTION_ID"
                echo "  ARM_USE_OIDC: $ARM_USE_OIDC"
                echo "========================================="

                cd $(System.DefaultWorkingDirectory)/terraform/dev

                echo "Running Terraform Init with OIDC..."
                terraform init -reconfigure \
                  -backend-config="resource_group_name=$(resourceGroupName)" \
                  -backend-config="storage_account_name=$(storageAccountName)" \
                  -backend-config="container_name=$(containerName)" \
                  -backend-config="key=$(stateKey)" \
                  -backend-config="use_azuread_auth=true"

                echo "Running Terraform Plan with OIDC..."
                terraform plan -var-file=$(DownloadSecureVars.SecureFilePath)

          - task: AzureCLI@2
            displayName: "Pre-create PostgreSQL Subnet"
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                SUBNET_NAME="$(postgresqlSubnetName)"
                VNET_NAME="$(vnetName)"
                VNET_RG="$(vnetResourceGroupName)"
                SUBNET_CIDR="$(postgresqlSubnetCidr)"
                ROUTE_TABLE_ID="$(routeTableId)"
                NSG_ID="$(networkSecurityGroupId)"
                
                echo "Checking if PostgreSQL subnet exists..."
                if az network vnet subnet show \
                  --resource-group "$VNET_RG" \
                  --vnet-name "$VNET_NAME" \
                  --name "$SUBNET_NAME" \
                  --query "id" -o tsv 2>/dev/null; then
                  
                  echo "✓ Subnet '$SUBNET_NAME' already exists"
                else
                  echo "Creating PostgreSQL subnet with route table and NSG..."
                  az network vnet subnet create \
                    --resource-group "$VNET_RG" \
                    --vnet-name "$VNET_NAME" \
                    --name "$SUBNET_NAME" \
                    --address-prefixes "$SUBNET_CIDR" \
                    --route-table "$ROUTE_TABLE_ID" \
                    --network-security-group "$NSG_ID" \
                    --service-endpoints Microsoft.Storage \
                    --output table
                    
                  if [ $? -eq 0 ]; then
                    echo "✓ Successfully created subnet '$SUBNET_NAME' with route table"
                  else
                    echo "✗ Failed to create subnet"
                    exit 1
                  fi
                fi

          - task: AzureCLI@2
            displayName: "Pre-create Container Apps Subnet"
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                VNET_NAME="$(vnetName)"
                VNET_RG="$(vnetResourceGroupName)"
                ROUTE_TABLE_ID="$(routeTableId)"
                NSG_ID="$(networkSecurityGroupId)"
                CONTAINER_SUBNET_NAME="$(containerAppsSubnetName)"
                CONTAINER_SUBNET_CIDR="$(containerAppsSubnetCidr)"
                
                echo "Checking if Container Apps subnet exists..."
                if az network vnet subnet show \
                  --resource-group "$VNET_RG" \
                  --vnet-name "$VNET_NAME" \
                  --name "$CONTAINER_SUBNET_NAME" \
                  --query "id" -o tsv 2>/dev/null; then
                  
                  echo "✓ Subnet '$CONTAINER_SUBNET_NAME' already exists"
                else
                  echo "Creating Container Apps subnet..."
                  az network vnet subnet create \
                    --resource-group "$VNET_RG" \
                    --vnet-name "$VNET_NAME" \
                    --name "$CONTAINER_SUBNET_NAME" \
                    --address-prefixes "$CONTAINER_SUBNET_CIDR" \
                    --route-table "$ROUTE_TABLE_ID" \
                    --network-security-group "$NSG_ID" \
                    --output table
                    
                  if [ $? -eq 0 ]; then
                    echo "✓ Successfully created Container Apps subnet"
                  else
                    echo "✗ Failed to create Container Apps subnet"
                    exit 1
                  fi
                fi

          - task: AzureCLI@2
            displayName: "Pre-create Private Endpoints Subnet"
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                VNET_NAME="$(vnetName)"
                VNET_RG="$(vnetResourceGroupName)"
                ROUTE_TABLE_ID="$(routeTableId)"
                NSG_ID="$(networkSecurityGroupId)"
                PRIVATE_ENDPOINTS_SUBNET_NAME="$(privateEndpointsSubnetName)"
                PRIVATE_ENDPOINTS_SUBNET_CIDR="$(privateEndpointsSubnetCidr)"
                
                echo "Checking if Private Endpoints subnet exists..."
                if az network vnet subnet show \
                  --resource-group "$VNET_RG" \
                  --vnet-name "$VNET_NAME" \
                  --name "$PRIVATE_ENDPOINTS_SUBNET_NAME" \
                  --query "id" -o tsv 2>/dev/null; then
                  
                  echo "✓ Subnet '$PRIVATE_ENDPOINTS_SUBNET_NAME' already exists"
                else
                  echo "Creating Private Endpoints subnet..."
                  az network vnet subnet create \
                    --resource-group "$VNET_RG" \
                    --vnet-name "$VNET_NAME" \
                    --name "$PRIVATE_ENDPOINTS_SUBNET_NAME" \
                    --address-prefixes "$PRIVATE_ENDPOINTS_SUBNET_CIDR" \
                    --route-table "$ROUTE_TABLE_ID" \
                    --network-security-group "$NSG_ID" \
                    --disable-private-endpoint-network-policies true \
                    --output table
                    
                  if [ $? -eq 0 ]; then
                    echo "✓ Successfully created Private Endpoints subnet"
                  else
                    echo "✗ Failed to create Private Endpoints subnet"
                    exit 1
                  fi
                fi

  - stage: Apply
    displayName: "Apply Terraform Plan"
    dependsOn: InitAndPlan
    condition: succeeded()
    jobs:
      - deployment: TerraformApply
        displayName: "Terraform Apply"
        pool:
          name: linux-internal-vmss-agent
        environment: "TFApproval"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: DownloadSecureFile@1
                  name: DownloadSecureVars
                  displayName: "Download nachet-dev.tfvars"
                  inputs:
                    secureFile: "nachet-dev.tfvars"

                - task: AzureCLI@2
                  displayName: "Terraform Apply with OIDC"
                  inputs:
                    azureSubscription: $(serviceConnectionName)
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    addSpnToEnvironment: true  # Critical for OIDC
                    inlineScript: |
                      echo "=== Azure Authentication via OIDC ==="
                      echo "Service Principal ID: $servicePrincipalId"
                      echo "Tenant ID: $tenantId"
                      echo "Subscription ID: $(az account show --query id -o tsv)"
                      
                      # Export ARM variables for Terraform OIDC authentication (Azure DevOps)
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                      export ARM_USE_OIDC=true
                      export ARM_OIDC_REQUEST_TOKEN="$SYSTEM_ACCESSTOKEN"
                      export ARM_OIDC_REQUEST_URL="$SYSTEM_OIDCREQUESTURI"
                      
                      echo "ARM variables exported for Terraform OIDC:"
                      echo "  ARM_CLIENT_ID: $ARM_CLIENT_ID"
                      echo "  ARM_TENANT_ID: $ARM_TENANT_ID"
                      echo "  ARM_SUBSCRIPTION_ID: $ARM_SUBSCRIPTION_ID"
                      echo "  ARM_USE_OIDC: $ARM_USE_OIDC"
                      echo "========================================="

                      cd $(System.DefaultWorkingDirectory)/terraform/dev

                      echo "Verifying Terraform installation..."
                      terraform version

                      echo "Running Terraform Init with OIDC..."
                      terraform init -reconfigure \
                        -backend-config="resource_group_name=$(resourceGroupName)" \
                        -backend-config="storage_account_name=$(storageAccountName)" \
                        -backend-config="container_name=$(containerName)" \
                        -backend-config="key=$(stateKey)" \
                        -backend-config="use_azuread_auth=true"

                      echo "Running Terraform Apply with OIDC..."
                      terraform apply -auto-approve -var-file=$(DownloadSecureVars.SecureFilePath)
