trigger:
  tags:
    include:
      - v*

pr: none

pool:
  name: linux-internal-vmss-agent

variables:
  - group: nachet-dev

stages:
  - stage: InitAndPlan
    displayName: "Initialize and Plan"
    jobs:
      - job: TerraformInitPlan
        displayName: "Terraform Init and Plan"
        steps:
          - checkout: self

          - task: Bash@3
            displayName: "Check Agent Public IP"
            inputs:
              targetType: 'inline'
              script: |
                echo "Agent public IP address:"
                curl -s ifconfig.me
                echo ""
        
          - task: DownloadSecureFile@1
            name: DownloadSecureVars
            displayName: "Download nachet-dev.tfvars"
            inputs:
              secureFile: "nachet-dev.tfvars"

          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/dev'
              backendServiceArm: '$(serviceConnectionName)'
              backendAzureRmResourceGroupName: '$(resourceGroupName)'
              backendAzureRmStorageAccountName: '$(storageAccountName)'
              backendAzureRmContainerName: '$(containerName)'
              backendAzureRmKey: '$(stateKey)'
            env:
              ARM_USE_AZUREAD: true

          - task: TerraformTaskV4@4
            displayName: "Terraform Plan"
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/dev'
              commandOptions: '-var-file=$(DownloadSecureVars.SecureFilePath)'
              environmentServiceNameAzureRM: '$(serviceConnectionName)'
            env:
              ARM_USE_AZUREAD: true

          - task: AzureCLI@2
            displayName: "Pre-create PostgreSQL Subnet"
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                SUBNET_NAME="$(postgresqlSubnetName)"
                VNET_NAME="$(vnetName)"
                VNET_RG="$(vnetResourceGroupName)"
                SUBNET_CIDR="$(postgresqlSubnetCidr)"
                ROUTE_TABLE_ID="$(routeTableId)"
                NSG_ID="$(networkSecurityGroupId)"
                
                echo "Checking if PostgreSQL subnet exists..."
                if az network vnet subnet show \
                  --resource-group "$VNET_RG" \
                  --vnet-name "$VNET_NAME" \
                  --name "$SUBNET_NAME" \
                  --query "id" -o tsv 2>/dev/null; then
                  
                  echo "✓ Subnet '$SUBNET_NAME' already exists"
                else
                  echo "Creating PostgreSQL subnet with route table and NSG..."
                  az network vnet subnet create \
                    --resource-group "$VNET_RG" \
                    --vnet-name "$VNET_NAME" \
                    --name "$SUBNET_NAME" \
                    --address-prefixes "$SUBNET_CIDR" \
                    --route-table "$ROUTE_TABLE_ID" \
                    --network-security-group "$NSG_ID" \
                    --service-endpoints Microsoft.Storage \
                    --output table
                    
                  if [ $? -eq 0 ]; then
                    echo "✓ Successfully created subnet '$SUBNET_NAME' with route table"
                  else
                    echo "✗ Failed to create subnet"
                    exit 1
                  fi
                fi

          - task: AzureCLI@2
            displayName: "Pre-create Container Apps Subnet"
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true  # Enable OIDC token access
              inlineScript: |
                VNET_NAME="$(vnetName)"
                VNET_RG="$(vnetResourceGroupName)"
                ROUTE_TABLE_ID="$(routeTableId)"
                NSG_ID="$(networkSecurityGroupId)"
                CONTAINER_SUBNET_NAME="$(containerAppsSubnetName)"
                CONTAINER_SUBNET_CIDR="$(containerAppsSubnetCidr)"
                
                echo "Checking if Container Apps subnet exists..."
                if az network vnet subnet show \
                  --resource-group "$VNET_RG" \
                  --vnet-name "$VNET_NAME" \
                  --name "$CONTAINER_SUBNET_NAME" \
                  --query "id" -o tsv 2>/dev/null; then
                  
                  echo "✓ Subnet '$CONTAINER_SUBNET_NAME' already exists"
                else
                  echo "Creating Container Apps subnet..."
                  az network vnet subnet create \
                    --resource-group "$VNET_RG" \
                    --vnet-name "$VNET_NAME" \
                    --name "$CONTAINER_SUBNET_NAME" \
                    --address-prefixes "$CONTAINER_SUBNET_CIDR" \
                    --route-table "$ROUTE_TABLE_ID" \
                    --network-security-group "$NSG_ID" \
                    --output table
                    
                  if [ $? -eq 0 ]; then
                    echo "✓ Successfully created Container Apps subnet"
                  else
                    echo "✗ Failed to create Container Apps subnet"
                    exit 1
                  fi
                fi

          - task: AzureCLI@2
            displayName: "Pre-create Private Endpoints Subnet"
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true  # Enable OIDC token access
              inlineScript: |
                VNET_NAME="$(vnetName)"
                VNET_RG="$(vnetResourceGroupName)"
                ROUTE_TABLE_ID="$(routeTableId)"
                NSG_ID="$(networkSecurityGroupId)"
                PRIVATE_ENDPOINTS_SUBNET_NAME="$(privateEndpointsSubnetName)"
                PRIVATE_ENDPOINTS_SUBNET_CIDR="$(privateEndpointsSubnetCidr)"
                
                echo "Checking if Private Endpoints subnet exists..."
                if az network vnet subnet show \
                  --resource-group "$VNET_RG" \
                  --vnet-name "$VNET_NAME" \
                  --name "$PRIVATE_ENDPOINTS_SUBNET_NAME" \
                  --query "id" -o tsv 2>/dev/null; then
                  
                  echo "✓ Subnet '$PRIVATE_ENDPOINTS_SUBNET_NAME' already exists"
                else
                  echo "Creating Private Endpoints subnet..."
                  az network vnet subnet create \
                    --resource-group "$VNET_RG" \
                    --vnet-name "$VNET_NAME" \
                    --name "$PRIVATE_ENDPOINTS_SUBNET_NAME" \
                    --address-prefixes "$PRIVATE_ENDPOINTS_SUBNET_CIDR" \
                    --route-table "$ROUTE_TABLE_ID" \
                    --network-security-group "$NSG_ID" \
                    --disable-private-endpoint-network-policies true \
                    --output table
                    
                  if [ $? -eq 0 ]; then
                    echo "✓ Successfully created Private Endpoints subnet"
                  else
                    echo "✗ Failed to create Private Endpoints subnet"
                    exit 1
                  fi
                fi

  - stage: Apply
    displayName: "Apply Terraform Plan"
    dependsOn: InitAndPlan
    condition: succeeded()
    jobs:
      - deployment: TerraformApply
        displayName: "Terraform Apply"
        pool:
          name: linux-internal-vmss-agent
        environment: "TFApproval"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: DownloadSecureFile@1
                  name: DownloadSecureVars
                  displayName: "Download nachet-dev.tfvars"
                  inputs:
                    secureFile: "nachet-dev.tfvars"

                - task: TerraformTaskV4@4
                  displayName: "Terraform Init"
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/dev'
                    backendServiceArm: '$(serviceConnectionName)'
                    backendAzureRmResourceGroupName: '$(resourceGroupName)'
                    backendAzureRmStorageAccountName: '$(storageAccountName)'
                    backendAzureRmContainerName: '$(containerName)'
                    backendAzureRmKey: '$(stateKey)'
                  env:
                    ARM_USE_AZUREAD: true  # Use AzureAD auth for backend instead of access keys

                - task: TerraformTaskV4@4
                  displayName: "Terraform Apply"
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/dev'
                    commandOptions: '-auto-approve -var-file=$(DownloadSecureVars.SecureFilePath)'
                    environmentServiceNameAzureRM: '$(serviceConnectionName)'
                  env:
                    ARM_USE_AZUREAD: true  # Use AzureAD auth for provider