[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nachet-backend"
version = "2.9.15"
description = "Canadian government (CFIA) AI-powered seed identification system backend"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Joseffus Santos", email = "Joseffus.Santos@inspection.gc.ca" },
    { name = "Francois Werbrouck", email = "francois.werbrouck@inspection.gc.ca" },
    { name = "Sylvanie You", email = "Sylvanie.You@inspection.gc.ca" }
]
keywords = ["nachet", "ai", "seed", "identification", "cfia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy==2.4.4",
    "azure-storage-blob[aio]==12.28.0",
    "azure-identity==1.25.3",
    "python-dotenv==1.2.2",
    "hypercorn==0.18.0",
    "Pillow==12.2.0",
    "cryptography==48.0.1",
    "pyyaml==6.0.3",
    "pydantic==2.13.0",
    "pydantic-core>=2.33.2",
    "python-magic==0.4.27",
    "PyJWT==2.12.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.116.1",
    "beartype>=0.21.0",
    "psycopg>=3.2.10",
    "psycopg-pool>=3.2.6",
    "pydantic-settings>=2.10.1",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0.43",
    "alembic>=1.16.5",
    "aiosqlite>=0.21.0",
    "h2>=4.3.0",
    "slowapi>=0.1.9",
    "loguru>=0.7.3",
    "opentelemetry-api>=1.37.0",
    "opentelemetry-sdk>=1.37.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.37.0",
    "opentelemetry-exporter-otlp-proto-http>=1.37.0",
    "uuid6>=2024.7.10",
    "dbos[otel]>=2.2.0",
    "boto3>=1.40.55",
    "pyright>=1.1.407",
    "boto3-stubs[s3]>=1.40.59",
]

[tool.nachet-db]
db-schema-version = "e47e20232a02"
previous-db-schema-version = "e63d0798d58d"

[dependency-groups]
dev = [
    "pytest-asyncio",
    "pytest>=8.4.1",
    "toml>=0.10.2",
    "pytest-cov>=6.2.1",
    "tqdm>=4.67.1",
    "ruff>=0.13.2",
    "pydeps>=3.0.1",
    "py2puml>=0.10.0",
    "pylint>=4.0.1",
]

sbom = ["cyclonedx-bom>=7.0.0"]

[project.urls]
Homepage = "https://github.com/ai-cfia/nachet"
Repository = "https://github.com/ai-cfia/nachet"
Documentation = "https://github.com/ai-cfia/nachet/tree/main/backend"
"Bug Tracker" = "https://github.com/ai-cfia/nachet/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "auth",
    "model",
    "pipelines",
    "storage",
    "tests"
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')"
]

[tool.coverage.run]
omit = [
    "*/tests/*",
    "tests/*",
    "app/*/tests/*",
    "app/blob/tests/*",
    "app/db/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.pyright]
include = ["app", "tests"]
exclude = ["**/node_modules",
    "**/__pycache__",
    "**/alembic",
    "app/main.py",
]
ignore = [".venv"]
defineConstant = { DEBUG = true }
stubPath = "../typings"
venvPath = ".venv"

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.13"
pythonPlatform = "Linux"

# strict = ["app"]
executionEnvironments = [
  { root = "tests"},
  { root = "app" }
]
