[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nachet-backend"
version = "1.11.3"
description = "Canadian government (CFIA) AI-powered seed identification system backend"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Joseffus Santos", email = "Joseffus.Santos@inspection.gc.ca" },
    { name = "Francois Werbrouck", email = "francois.werbrouck@inspection.gc.ca" },
    { name = "Sylvanie You", email = "Sylvanie.You@inspection.gc.ca" }
]
keywords = ["nachet", "ai", "seed", "identification", "cfia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy==1.26.4",
    "azure-storage-blob[aio]==12.26.0",
    "azure-identity==1.25.0",
    "python-dotenv==1.1.1",
    "hypercorn==0.17.3",
    "Pillow==10.4.0",
    "cryptography==46.0.1",
    "pyyaml==6.0.2",
    "pydantic==2.11.9",
    "pydantic-core==2.33.2",
    "python-magic==0.4.27",
    "PyJWT==2.10.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.116.1",
    "beartype>=0.21.0",
    "psycopg>=3.2.10",
    "psycopg-pool>=3.2.6",
    "pydantic-settings>=2.10.1",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0.43",
    "alembic>=1.16.5",
    "aiosqlite>=0.21.0",
    "h2>=4.3.0",
]

[tool.nachet-db]
db-schema-version = "0.0.12"
previous-db-schema-version = "0.0.11"

[dependency-groups]
dev = [
    "cyclonedx-bom>=7.0.0",
    "pytest-asyncio",
    "pytest>=8.4.1",
    "toml>=0.10.2",
    "pytest-cov>=6.2.1",
    "tqdm>=4.67.1",
]

[project.urls]
Homepage = "https://github.com/ai-cfia/nachet"
Repository = "https://github.com/ai-cfia/nachet"
Documentation = "https://github.com/ai-cfia/nachet/tree/main/backend"
"Bug Tracker" = "https://github.com/ai-cfia/nachet/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "auth",
    "model",
    "pipelines",
    "storage",
    "tests"
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')"
]
