[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nachet-backend"
version = "1.0.0"
description = "Canadian government (CFIA) AI-powered seed identification system backend"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Francois Werbrouck", email = "francois.werbrouck@inspection.gc.ca" },
    { name = "Sylvanie You", email = "Sylvanie.You@inspection.gc.ca" },
    { name = "Joseffus Santos", email = "Joseffus.Santos@inspection.gc.ca" }
]
keywords = ["nachet", "ai", "seed", "identification", "cfia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "nachet-datastore @ git+https://github.com/ai-cfia/nachet.git@v1.1.3-nachet-datastore#subdirectory=datastore",
    # "nachet-datastore @ file:///home/path/to/nachet/datastore",
    "numpy==1.26.4",
    "azure-storage-blob",
    "azure-identity",
    "flask==3.0.3",
    "quart==0.19.6",
    "quart-cors",
    "python-dotenv",
    "hypercorn",
    "Pillow==10.3.0",
    "cryptography",
    "pyyaml",
    "pydantic==2.7.1",
    "pydantic-core==2.18.2",
    "python-magic",
    "PyJWT",
    "pytest",
    "pytest-asyncio",
]

[project.urls]
Homepage = "https://github.com/ai-cfia/nachet"
Repository = "https://github.com/ai-cfia/nachet"
Documentation = "https://github.com/ai-cfia/nachet/tree/main/backend"
"Bug Tracker" = "https://github.com/ai-cfia/nachet/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "auth",
    "model", 
    "pipelines",
    "storage",
    "tests"
]
