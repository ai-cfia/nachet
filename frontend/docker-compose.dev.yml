---

services:
  nachet-frontend-dev:
    container_name: nachet-frontend-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
    image: nachet-frontend:dev
    ports:
      - "5173:5173"  # Vite dev server port
    volumes:
      # Mount entire frontend directory for full VS Code development
      - ./:/app
    env_file:
      - ./.env.config.local
    working_dir: /app
    command: bash -c "source ~/.bashrc && npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
