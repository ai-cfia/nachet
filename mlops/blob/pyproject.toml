[build-system]
requires = ["setuptools>=80,<100"]
build-backend = "setuptools.build_meta"

[project]
name = "blob-controller"
version = "0.1.0"
description = "Reusable blob storage providers for Nachet MLOps"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "azure-storage-blob==12.28.0",
    "beartype>=0.21,<1",
    "boto3>=1.40.55,<2",
    "pydantic==2.13.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.13,<1"]

[tool.setuptools]
packages = [
    "blob_controller",
    "blob_controller.azure",
    "blob_controller.azure.operations",
    "blob_controller.azure.utils",
    "blob_controller.s3",
    "blob_controller.s3.operations",
    "blob_controller.s3.utils",
]
package-dir = { blob_controller = "." }
include-package-data = false

[tool.setuptools.package-data]
blob_controller = ["PROVENANCE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["blob_controller"]
