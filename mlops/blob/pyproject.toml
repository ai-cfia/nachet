[build-system]
requires = ["setuptools>=80,<100"]
build-backend = "setuptools.build_meta"

[project]
name = "nachet-blob"
version = "0.1.0"
description = "Reusable Nachet blob storage providers"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "azure-storage-blob==12.28.0",
    "beartype>=0.21,<1",
    "boto3>=1.40.55,<2",
    "loguru>=0.7.3,<1",
    "pydantic==2.13.0",
]

[dependency-groups]
dev = [
    "pydantic-settings>=2.10.1,<3",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
    "python-dotenv>=1.2.2,<2",
    "ruff>=0.13,<1",
]

[tool.setuptools]
packages = [
    "blob",
    "blob.azure",
    "blob.azure.operations",
    "blob.azure.utils",
    "blob.s3",
    "blob.s3.operations",
    "blob.s3.utils",
]
package-dir = { blob = "." }
include-package-data = false

[tool.setuptools.package-data]
blob = ["PROVENANCE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_default_fixture_loop_scope = "session"
markers = ["integration: opt-in tests that use live Azure/S3 storage"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Keep copied formatting and unused imports intact; check correctness only.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# Preserve the copied enum's string behavior until a separate behavior change.
"constants.py" = ["UP042"]
