[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nachet-blob"
version = "0.1.0"
description = "Reusable blob storage providers for Nachet MLOps"
requires-python = ">=3.12,<3.14"
dependencies = [
    "azure-storage-blob==12.28.0",
    "beartype>=0.21,<1",
    "boto3>=1.40.55,<2",
    "pydantic==2.13.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.13,<1"]

[tool.hatch.build.targets.wheel]
packages = ["mlops_blob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
