[project]
name = "nachet-detector-trainer"
version = "0.1.0"
description = "Nachet detector training runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.12.0",
    "albumentationsx==2.0.13",
    "boto3==1.40.55",
    "datasets==4.4.1",
    "mlflow-skinny==3.7.0",
    "opencv-python-headless==4.13.0.90",
    "pycocotools==2.0.10",
    "pyyaml==6.0.2",
    "torchmetrics==1.8.2",
    "transformers==5.16.1",
]

[tool.uv]
# Use CUDA-enabled PyTorch from the NVIDIA base image instead of installing it
# with uv. This project requires that image to run training.
exclude-dependencies = ["torch"]
