[project]
name = "nachet-detector-trainer"
version = "0.1.0"
description = "Nachet detector training runtime"
requires-python = ">=3.14,<3.15"
dependencies = [
    "accelerate==1.15.0",
    "albumentationsx==2.4.10",
    "boto3==1.43.98",
    "datasets==4.8.5",
    "matplotlib==3.11.2",
    "mlflow-skinny==3.16.1",
    "numpy==2.5.3",
    "opencv-python-headless==4.14.0.94",
    "pandas==3.0.6",
    "pillow==12.0.0",
    "pycocotools==2.0.11",
    "pyyaml==6.0.3",
    "seaborn==0.13.2",
    "torchmetrics==1.9.0",
    "tqdm==4.70.1",
    "transformers==5.17.0",
]

[tool.uv]
# Use CUDA-enabled PyTorch from the NVIDIA base image instead of installing it
# with uv. This project requires that image to run training.
exclude-dependencies = ["torch"]
