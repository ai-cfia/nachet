[project]
name = "nachet-detector-trainer"
version = "0.3.3"
description = "Nachet detector training runtime"
requires-python = ">=3.15,<3.16"
dependencies = [
    "accelerate==1.16.0",
    "albumentationsx==2.6.7",
    "boto3==1.44.9",
    "datasets==4.4.1",
    "filelock==3.32.5",
    "matplotlib==3.11.2",
    "mlflow-skinny==3.18.0",
    "nachet-dataset-release==0.1.2",
    "numpy==2.5.5",
    "onnxruntime-gpu==1.32.0; sys_platform == 'linux'",
    "onnxruntime==1.32.0; sys_platform != 'linux'",
    "opencv-python-headless==4.14.0.94",
    "pandas==3.1.1",
    "pillow==13.0.0",
    "pycocotools==2.0.11",
    "pyyaml==6.0.4",
    "seaborn==0.13.2",
    "torchmetrics==1.9.0",
    "tqdm==4.70.1",
    "transformers==5.24.0",
]

[dependency-groups]
test = ["onnx==1.23.2"]

[tool.uv]
# Use CUDA-enabled PyTorch from the NVIDIA base image instead of installing it
# with uv. This project requires that image to run training.
exclude-dependencies = ["torch"]

[tool.uv.sources]
nachet-dataset-release = { path = "../../datasets" }
nachet-blob = { path = "../../blob" }
