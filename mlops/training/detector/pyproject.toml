[project]
name = "nachet-detector-trainer"
version = "0.3.0"
description = "Nachet detector training runtime"
requires-python = ">=3.15,<3.16"
dependencies = [
    "accelerate==1.15.0",
    "albumentationsx==2.5.1",
    "boto3==1.43.114",
    "datasets==4.4.1",
    "matplotlib==3.11.2",
    "mlflow-skinny==3.17.1",
    "numpy==2.5.4",
    "onnxruntime-gpu==1.31.0; sys_platform == 'linux'",
    "onnxruntime==1.31.0; sys_platform != 'linux'",
    "opencv-python-headless==4.14.0.94",
    "pandas==3.0.6",
    "pillow==12.0.0",
    "pycocotools==2.0.11",
    "pyyaml==6.0.3",
    "seaborn==0.13.2",
    "torchmetrics==1.9.0",
    "tqdm==4.70.1",
    "transformers==5.20.1",
]

[dependency-groups]
test = ["onnx==1.23.2"]

[tool.uv]
# Use CUDA-enabled PyTorch from the NVIDIA base image instead of installing it
# with uv. This project requires that image to run training.
exclude-dependencies = ["torch"]
