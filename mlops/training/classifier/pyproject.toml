[project]
name = "nachet-classifier-trainer"
version = "0.1.0"
description = "Nachet classifier training runtime"
requires-python = ">=3.14,<3.15"
dependencies = [
    "accelerate==1.15.0",
    "boto3==1.43.93",
    "datasets==4.8.5",
    "mlflow-skinny==3.16.0",
    "scikit-learn==1.9.1",
    "transformers==5.17.0",
]

[tool.uv]
# Use the CUDA PyTorch and matching torchvision supplied by the NVIDIA image.
exclude-dependencies = ["torch", "torchvision"]
