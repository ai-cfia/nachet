[project]
name = "nachet-classifier-trainer"
version = "0.3.3"
description = "Nachet classifier training runtime"
requires-python = ">=3.15,<3.16"
dependencies = [
    "accelerate==1.16.0",
    "boto3==1.44.9",
    "datasets==4.4.1",
    "filelock==3.32.6",
    "matplotlib==3.11.2",
    "mlflow-skinny==3.18.0",
    "nachet-dataset-release==0.1.2",
    "numpy==2.5.5",
    "onnxruntime-gpu==1.32.0; sys_platform == 'linux'",
    "onnxruntime==1.32.0; sys_platform != 'linux'",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "seaborn==0.13.2",
    "transformers==5.24.0",
]

[dependency-groups]
test = ["onnx==1.23.2"]

[tool.uv]
# Use the CUDA PyTorch and matching torchvision supplied by the NVIDIA image.
exclude-dependencies = ["torch", "torchvision"]

[tool.uv.sources]
nachet-dataset-release = { path = "../../datasets" }
nachet-blob = { path = "../../blob" }
