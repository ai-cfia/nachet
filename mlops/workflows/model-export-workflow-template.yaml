---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nachet-model-export
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: nachet-model-export
    app.kubernetes.io/part-of: nachet
spec:
  entrypoint: export-model
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - name: model-kind
        enum: [classifier, detector]
        description: Training storage layout containing the selected checkpoint.
      - name: training-run
        description: Training run containing the selected checkpoint.
      - name: checkpoint
        description: Checkpoint directory selected after reviewing evaluation.
      - name: quantize
        description: Also create the AVX512 INT8 model.
        value: "false"
        enum: ["false", "true"]
  templates:
    - name: export-model
      inputs:
        parameters:
          - name: model-kind
          - name: training-run
          - name: checkpoint
          - name: quantize
            default: "false"
      steps:
        - - name: export
            template: export
            arguments:
              parameters:
                - name: model-kind
                  value: "{{inputs.parameters.model-kind}}"
                - name: training-run
                  value: "{{inputs.parameters.training-run}}"
                - name: checkpoint
                  value: "{{inputs.parameters.checkpoint}}"
                - name: quantize
                  value: "{{inputs.parameters.quantize}}"
        - - name: prepare-browser
            template: prepare-browser
            when: "{{=inputs.parameters['model-kind'] == 'classifier'}}"
            arguments:
              parameters:
                - name: model-kind
                  value: "{{inputs.parameters.model-kind}}"
                - name: training-run
                  value: "{{inputs.parameters.training-run}}"
                - name: checkpoint
                  value: "{{inputs.parameters.checkpoint}}"

    - name: export
      inputs:
        parameters:
          - name: model-kind
          - name: training-run
          - name: checkpoint
          - name: quantize
      container:
        image: ghcr.io/ai-cfia/nachet-export:main
        imagePullPolicy: Always
        command: [sh, -ec]
        args:
          - |
            if [ "$3" = true ]; then
              exec python export_model.py --checkpoint "$1" --output "$2" --quantize
            fi
            exec python export_model.py --checkpoint "$1" --output "$2"
          - export
          - "/runs/{{inputs.parameters.training-run}}/trainer-output/{{inputs.parameters.checkpoint}}"
          - "/exports/{{workflow.name}}"
          - "{{inputs.parameters.quantize}}"
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            cpu: "4"
            memory: 16Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: training-storage
            mountPath: /runs
            subPath: "nachet/{{inputs.parameters.model-kind}}-training/runs"
            readOnly: true
          - name: training-storage
            mountPath: /exports
            subPath: nachet/exports
          - name: tmp
            mountPath: /tmp

    - name: prepare-browser
      inputs:
        parameters:
          - name: model-kind
          - name: training-run
          - name: checkpoint
      container:
        image: ghcr.io/ai-cfia/nachet-export:main
        imagePullPolicy: Always
        command: [python]
        args:
          - browser_cam.py
          - --onnx
          - "/exports/{{workflow.name}}/onnx-fp32/model.onnx"
          - --checkpoint
          - "/runs/{{inputs.parameters.training-run}}/trainer-output/{{inputs.parameters.checkpoint}}"
          - --output
          - "/exports/{{workflow.name}}/browser"
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            cpu: "4"
            memory: 16Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: training-storage
            mountPath: /runs
            subPath: "nachet/{{inputs.parameters.model-kind}}-training/runs"
            readOnly: true
          - name: training-storage
            mountPath: /exports
            subPath: nachet/exports
          - name: tmp
            mountPath: /tmp
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: training-storage
      persistentVolumeClaim:
        claimName: nachet-training-workspace-pvc
    - name: tmp
      emptyDir: {}
