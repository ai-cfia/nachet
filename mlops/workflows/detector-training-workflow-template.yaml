---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nachet-detector-training
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: nachet-detector-training
    app.kubernetes.io/part-of: nachet
spec:
  entrypoint: detector-training
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - name: dataset-config
        description: >-
          Dataset configuration path below the prepared input directory.
        value: dataset.yaml
      - name: model-path
        description: Base model directory below the prepared input directory.
        value: model
      - name: run-profile
        description: Training defaults for a smoke or full run.
        value: smoke
        enum:
          - smoke
          - full
      - name: gpu-node
        description: GPU node used for training.
        value: ai-lab-1
        enum:
          - ai-lab-1
          - ai-lab-2
          - ai-lab-3
      - name: epochs
        description: Positive integer, or profile-default.
        value: profile-default
      - name: checkpoint-retention
        description: Number of recent checkpoints to keep, or profile-default.
        value: profile-default
      - name: image-size
        description: Square detector input size, or profile-default.
        value: profile-default
      - name: batch-size
        description: Per-device batch size, or profile-default.
        value: profile-default
      - name: gradient-accumulation-steps
        description: Gradient accumulation steps, or profile-default.
        value: profile-default
      - name: warmup-steps
        description: Non-negative warm-up steps, or profile-default.
        value: profile-default
      - name: learning-rate
        description: Positive learning rate, or profile-default.
        value: profile-default
      - name: seed
        description: Non-negative random seed, or profile-default.
        value: profile-default
      - name: resume-run-id
        description: Earlier workflow run to resume, or none for a new run.
        value: none
      - name: resume-checkpoint
        description: Checkpoint from the earlier run, or latest.
        value: latest
  templates:
    - name: detector-training
      steps:
        - - name: train
            template: train
            arguments:
              parameters:
                - name: gpu-node
                  value: "{{workflow.parameters.gpu-node}}"
        - - name: list-checkpoints
            template: list-checkpoints
        - - name: review-checkpoints
            template: checkpoint-review
            arguments:
              parameters:
                - name: selected-checkpoint-1
                  value: >-
                    {{steps.list-checkpoints.outputs.parameters.checkpoint-options}}
                - name: selected-checkpoint-2
                  value: >-
                    {{steps.list-checkpoints.outputs.parameters.optional-checkpoint-options}}
                - name: selected-checkpoint-3
                  value: >-
                    {{steps.list-checkpoints.outputs.parameters.optional-checkpoint-options}}
        - - name: check-checkpoint-selections
            template: check-checkpoint-selections
            arguments:
              parameters:
                - name: checkpoint-options
                  value: >-
                    {{steps.list-checkpoints.outputs.parameters.checkpoint-options}}
                - name: selected-checkpoint-1
                  value: >-
                    {{steps.review-checkpoints.outputs.parameters.selected-checkpoint-1}}
                - name: selected-checkpoint-2
                  value: >-
                    {{steps.review-checkpoints.outputs.parameters.selected-checkpoint-2}}
                - name: selected-checkpoint-3
                  value: >-
                    {{steps.review-checkpoints.outputs.parameters.selected-checkpoint-3}}
      outputs:
        parameters:
          - name: mlflow-run-id
            valueFrom:
              parameter: "{{steps.train.outputs.parameters.mlflow-run-id}}"
          - name: mlflow-run-url
            valueFrom:
              parameter: "{{steps.train.outputs.parameters.mlflow-run-url}}"
          - name: checkpoint-options
            valueFrom:
              parameter: >-
                {{steps.list-checkpoints.outputs.parameters.checkpoint-options}}
          - name: selected-checkpoints
            valueFrom:
              parameter: >-
                {{steps.check-checkpoint-selections.outputs.parameters.selected-checkpoints}}

    - name: train
      inputs:
        parameters:
          - name: gpu-node
      outputs:
        parameters:
          - name: mlflow-run-id
            globalName: mlflow-run-id
            valueFrom:
              path: "/runs/{{workflow.name}}/mlflow-run-id"
          - name: mlflow-run-url
            globalName: mlflow-run-url
            valueFrom:
              path: "/runs/{{workflow.name}}/mlflow-run-url"
      retryStrategy:
        limit: "2"
        retryPolicy: OnFailure
      synchronization:
        mutexes:
          - name: nachet-training-{{inputs.parameters.gpu-node}}
      nodeSelector:
        kubernetes.io/hostname: "{{inputs.parameters.gpu-node}}"
      container:
        image: ghcr.io/ai-cfia/nachet-detector-trainer:0.1.0
        imagePullPolicy: IfNotPresent
        args:
          - --dataset-root
          - /inputs
          - --dataset-config
          - "{{workflow.parameters.dataset-config}}"
          - --model-path
          - "{{workflow.parameters.model-path}}"
          - --run-profile
          - "{{workflow.parameters.run-profile}}"
          - --epochs
          - "{{workflow.parameters.epochs}}"
          - --checkpoint-retention
          - "{{workflow.parameters.checkpoint-retention}}"
          - --image-size
          - "{{workflow.parameters.image-size}}"
          - --batch-size
          - "{{workflow.parameters.batch-size}}"
          - --gradient-accumulation-steps
          - "{{workflow.parameters.gradient-accumulation-steps}}"
          - --warmup-steps
          - "{{workflow.parameters.warmup-steps}}"
          - --learning-rate
          - "{{workflow.parameters.learning-rate}}"
          - --seed
          - "{{workflow.parameters.seed}}"
          - --run-id
          - "{{workflow.name}}"
          - --runs-root
          - /runs
          - --resume-run-id
          - "{{workflow.parameters.resume-run-id}}"
          - --resume-checkpoint
          - "{{workflow.parameters.resume-checkpoint}}"
        envFrom:
          - secretRef:
              name: nachet-training-s3
        env:
          - name: MLFLOW_TRACKING_URI
            value: http://mlflow.mlflow.svc.cluster.local:5000
          - name: MLFLOW_EXPERIMENT_NAME
            value: RT-DETR-v2_101spp_object-detector
          - name: MLFLOW_PUBLIC_URL
            value: https://mlflow.inspection.alpha.canada.ca
          - name: HF_HOME
            value: /scratch/huggingface
          - name: XDG_CACHE_HOME
            value: /scratch/cache
        resources:
          requests:
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: training-storage
            mountPath: /inputs
            subPath: nachet/detector-training/inputs
            readOnly: true
          - name: training-storage
            mountPath: /runs
            subPath: nachet/detector-training/runs
          - name: scratch
            mountPath: /scratch
          - name: tmp
            mountPath: /tmp

    - name: list-checkpoints
      outputs:
        parameters:
          - name: checkpoint-options
            globalName: checkpoint-options
            valueFrom:
              path: /tmp/checkpoint-options
          - name: optional-checkpoint-options
            valueFrom:
              path: /tmp/optional-checkpoint-options
      nodeSelector:
        kubernetes.io/hostname: "{{workflow.parameters.gpu-node}}"
      container:
        image: ghcr.io/ai-cfia/nachet-detector-trainer:0.1.0
        imagePullPolicy: IfNotPresent
        command:
          - python
          - -m
          - checkpoints
        args:
          - --run-id
          - "{{workflow.name}}"
          - list
          - --output
          - /tmp/checkpoint-options
          - --optional-output
          - /tmp/optional-checkpoint-options
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: training-storage
            mountPath: /runs
            subPath: nachet/detector-training/runs
            readOnly: true
          - name: tmp
            mountPath: /tmp

    - name: checkpoint-review
      inputs:
        parameters:
          - name: selected-checkpoint-1
            description: >-
              First checkpoint selected after reviewing the MLflow run.
          - name: selected-checkpoint-2
            description: >-
              Optional second checkpoint. Choose a different checkpoint or none.
          - name: selected-checkpoint-3
            description: >-
              Optional third checkpoint. Choose a different checkpoint or none.
      outputs:
        parameters:
          - name: selected-checkpoint-1
            valueFrom:
              supplied: {}
          - name: selected-checkpoint-2
            valueFrom:
              supplied: {}
          - name: selected-checkpoint-3
            valueFrom:
              supplied: {}
      suspend: {}

    - name: check-checkpoint-selections
      inputs:
        parameters:
          - name: checkpoint-options
          - name: selected-checkpoint-1
          - name: selected-checkpoint-2
          - name: selected-checkpoint-3
      outputs:
        parameters:
          - name: selected-checkpoints
            globalName: selected-checkpoints
            valueFrom:
              path: /tmp/selected-checkpoints
      nodeSelector:
        kubernetes.io/hostname: "{{workflow.parameters.gpu-node}}"
      container:
        image: ghcr.io/ai-cfia/nachet-detector-trainer:0.1.0
        imagePullPolicy: IfNotPresent
        command:
          - python
          - -m
          - checkpoints
        args:
          - --run-id
          - "{{workflow.name}}"
          - validate-selection
          - --checkpoint-options
          - "{{inputs.parameters.checkpoint-options}}"
          - --selected-checkpoint
          - "{{inputs.parameters.selected-checkpoint-1}}"
          - "{{inputs.parameters.selected-checkpoint-2}}"
          - "{{inputs.parameters.selected-checkpoint-3}}"
          - --output
          - /tmp/selected-checkpoints
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: training-storage
            mountPath: /runs
            subPath: nachet/detector-training/runs
            readOnly: true
          - name: tmp
            mountPath: /tmp
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: training-storage
      persistentVolumeClaim:
        claimName: nachet-training-workspace-pvc
    - name: scratch
      emptyDir: {}
    - name: tmp
      emptyDir: {}
