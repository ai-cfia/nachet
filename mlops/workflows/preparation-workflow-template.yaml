---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nachet-preparation
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: nachet-preparation
    app.kubernetes.io/part-of: nachet
spec:
  entrypoint: prepare-for-review
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - name: cpu-image
        description: CPU preparation image. Defaults to the main build; use a digest to pin it.
        value: ghcr.io/ai-cfia/nachet-preparation-cpu:main
      - name: sam3-image
        description: SAM3 image. Defaults to the main build; use a digest to pin it.
        value: ghcr.io/ai-cfia/nachet-preparation-sam3:main
      - name: registration-image
        description: FiftyOne registration image. Defaults to the main build; use a digest to pin it.
        value: ghcr.io/ai-cfia/nachet-preparation-registration:main
      - name: code-revision
        description: Source revision label for these images. Required; not verified automatically.
      - name: dataset-name
        description: New FiftyOne review dataset; existing names are refused.
      - name: raw-prefix
        description: One collection below raw/ in the dataset bucket.
      - name: model-pvc
        description: Readable PVC in this namespace with SAM3 weights at its root.
      - name: gpu-node
        description: GPU node for SAM3. Defaults to ai-lab-1.
        value: ai-lab-1
        enum: [ai-lab-1, ai-lab-2, ai-lab-3]
      - name: workspace-pvc
        description: RWX workspace for COCO files. Defaults to nachet-training-workspace-pvc.
        value: nachet-training-workspace-pvc
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: "{{workflow.parameters.workspace-pvc}}"
    - name: model
      persistentVolumeClaim:
        claimName: "{{workflow.parameters.model-pvc}}"
        readOnly: true
    - name: tmp
      emptyDir: {}
  templates:
    - name: prepare-for-review
      steps:
        - - name: prepare-images
            template: prepare-images
        - - name: prelabel
            template: prelabel
        - - name: register-for-review
            template: register-for-review

    - name: prepare-images
      retryStrategy:
        limit: "2"
        retryPolicy: OnFailure
      container:
        image: "{{workflow.parameters.cpu-image}}"
        command: [python, /opt/preparation/prepare_s3.py]
        args:
          - /workspace/{{workflow.name}}/prepared
          - --bucket
          - "$(PREPARATION_BUCKET)"
          - --endpoint-url
          - "$(PREPARATION_ENDPOINT_URL)"
          - --region
          - "$(PREPARATION_REGION)"
          - --raw-prefix
          - "{{workflow.parameters.raw-prefix}}"
          - --code-revision
          - "{{workflow.parameters.code-revision}}"
        env:
          - name: PREPARATION_BUCKET
            valueFrom:
              configMapKeyRef: {name: nachet-preparation-config, key: bucket}
          - name: PREPARATION_ENDPOINT_URL
            valueFrom:
              configMapKeyRef: {name: nachet-preparation-config, key: endpoint-url}
          - name: PREPARATION_REGION
            valueFrom:
              configMapKeyRef: {name: nachet-preparation-config, key: region}
        envFrom:
          - secretRef:
              name: nachet-preparation-storage
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "2", memory: 4Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: tmp
            mountPath: /tmp

    - name: prelabel
      synchronization:
        mutexes:
          - name: nachet-training-{{workflow.parameters.gpu-node}}
      nodeSelector:
        kubernetes.io/hostname: "{{workflow.parameters.gpu-node}}"
      container:
        image: "{{workflow.parameters.sam3-image}}"
        command: [python, /opt/preparation/prelabel.py]
        args:
          - /workspace/{{workflow.name}}/prepared/index.coco.json
          - "s3://$(PREPARATION_BUCKET)"
          - /workspace/{{workflow.name}}/prepared/draft.coco.json
          - --endpoint-url
          - "$(PREPARATION_ENDPOINT_URL)"
          - --region
          - "$(PREPARATION_REGION)"
          - --model-path
          - /model
          - --model-revision
          - "$(PREPARATION_MODEL_REVISION)"
          - --device
          - cuda
        env:
          - name: PREPARATION_BUCKET
            valueFrom:
              configMapKeyRef: {name: nachet-preparation-config, key: bucket}
          - name: PREPARATION_ENDPOINT_URL
            valueFrom:
              configMapKeyRef: {name: nachet-preparation-config, key: endpoint-url}
          - name: PREPARATION_REGION
            valueFrom:
              configMapKeyRef: {name: nachet-preparation-config, key: region}
          - name: PREPARATION_MODEL_REVISION
            valueFrom:
              configMapKeyRef: {name: nachet-preparation-config, key: model-revision}
        envFrom:
          - secretRef:
              name: nachet-preparation-storage
        resources:
          requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
          limits: {cpu: "4", memory: 16Gi, nvidia.com/gpu: "1"}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: model
            mountPath: /model
            readOnly: true
          - name: tmp
            mountPath: /tmp

    - name: register-for-review
      container:
        image: "{{workflow.parameters.registration-image}}"
        command: [python, /opt/preparation/register_fiftyone.py]
        args:
          - "{{workflow.parameters.dataset-name}}"
          - /workspace/{{workflow.name}}/prepared/draft.coco.json
          - --server-media-root
          - "$(PREPARATION_SERVER_MEDIA_ROOT)"
        env:
          - name: PREPARATION_SERVER_MEDIA_ROOT
            valueFrom:
              configMapKeyRef: {name: nachet-preparation-config, key: server-media-root}
        envFrom:
          - secretRef:
              name: nachet-preparation-fiftyone
        resources:
          requests: {cpu: 250m, memory: 1Gi}
          limits: {cpu: "1", memory: 4Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
            readOnly: true
          - name: tmp
            mountPath: /tmp
