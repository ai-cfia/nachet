---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nachet-preparation
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: nachet-preparation
    app.kubernetes.io/part-of: nachet
spec:
  entrypoint: all-steps
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - name: cpu-image
        description: CPU preparation image. Defaults to the main build; use a digest to pin it.
        value: ghcr.io/ai-cfia/nachet-preparation-cpu:main
      - name: sam3-image
        description: SAM3 image. Defaults to the main build; use a digest to pin it.
        value: ghcr.io/ai-cfia/nachet-preparation-sam3:main
      - name: registration-image
        description: FiftyOne registration image. Defaults to the main build; use a digest to pin it.
        value: ghcr.io/ai-cfia/nachet-preparation-registration:main
      - name: code-revision
        description: Source revision label for these images. Required; not verified automatically.
      - name: dataset-name
        description: New FiftyOne review dataset; existing names are refused.
      - name: raw-prefix
        description: One collection below raw/ in the dataset bucket.
      - name: duplicate-conflicts
        description: Temporary warn mode retains conflicting sources and the first species/split; error stays strict.
        value: error
        enum: [error, warn]
      - name: invalid-images
        description: Skip mode logs and records undecodable images; storage failures remain fatal.
        value: error
        enum: [error, skip]
      - name: resume-run-id
        description: >-
          Argo workflow name of the previous attempt that owns the checkpoints.
          The new run copies and verifies them before asking to clean up the
          previous run's checkpoints. Defaults to the current workflow name.
          Also supplies the default index-run-id and draft-run-id for direct steps.
        value: "{{workflow.name}}"
      - name: draft-run-id
        description: >-
          Argo workflow name of the run where prelabel wrote draft.coco.json.
          Direct register-for-review imports that draft. Defaults to resume-run-id.
        value: "{{workflow.parameters.resume-run-id}}"
      - name: model-revision
        description: Revision label for the selected model files. Required; not verified automatically.
      - name: gpu-node
        description: GPU node for SAM3. Defaults to ai-lab-1.
        value: ai-lab-1
        enum: [ai-lab-1, ai-lab-2, ai-lab-3]
      - name: workspace-pvc
        description: RWX workspace for COCO files and checkpoints. Defaults to nachet-training-workspace-pvc.
        value: nachet-training-workspace-pvc
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: "{{workflow.parameters.workspace-pvc}}"
    - name: tmp
      emptyDir: {}
  templates:
    - name: all-steps
      steps:
        - - name: resume-checkpoints
            template: resume-checkpoints
            when: "{{=workflow.parameters['resume-run-id'] != workflow.name}}"
        - - name: prepare-images
            template: run-prepare-images
        - - name: audit-checksums
            template: audit-checksums
            arguments:
              parameters:
                - name: index-run-id
                  value: "{{workflow.name}}"
        - - name: prelabel
            template: run-prelabel
            arguments:
              parameters:
                - name: index-run-id
                  value: "{{workflow.name}}"
        - - name: register-for-review
            template: register-for-review
            arguments:
              parameters:
                - name: draft-run-id
                  value: "{{workflow.name}}"
        - - name: approve-current-checkpoint-cleanup
            template: approve-checkpoint-cleanup
            arguments:
              parameters:
                - name: run-name
                  value: "{{workflow.name}}"
        - - name: cleanup-current-checkpoints
            template: cleanup-checkpoints
            arguments:
              parameters:
                - name: run-name
                  value: "{{workflow.name}}"

    - name: resume-checkpoints
      steps:
        - - name: copy-checkpoints
            template: transfer-checkpoints
            arguments:
              parameters:
                - name: action
                  value: copy
        - - name: approve-previous-checkpoint-cleanup
            template: approve-checkpoint-cleanup
            when: "{{=steps['copy-checkpoints'].outputs.result == 'true'}}"
            arguments:
              parameters:
                - name: run-name
                  value: "{{workflow.parameters.resume-run-id}}"
        - - name: cleanup-previous-checkpoints
            template: transfer-checkpoints
            when: "{{=steps['copy-checkpoints'].outputs.result == 'true'}}"
            arguments:
              parameters:
                - name: action
                  value: cleanup

    - name: transfer-checkpoints
      inputs:
        parameters:
          - name: action
      retryStrategy:
        limit: "2"
        retryPolicy: OnFailure
      container:
        image: "{{workflow.parameters.cpu-image}}"
        command: [python, /opt/preparation/transfer_checkpoints.py]
        args:
          - "{{inputs.parameters.action}}"
          - /workspace
          - "{{workflow.parameters.resume-run-id}}"
          - "{{workflow.name}}"
        resources:
          requests: {cpu: 250m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: approve-checkpoint-cleanup
      inputs:
        parameters:
          - name: run-name
            description: Resume only after all users of this run's checkpoints have finished; cleanup is irreversible.
      suspend: {}

    - name: cleanup-checkpoints
      inputs:
        parameters:
          - name: run-name
      container:
        image: "{{workflow.parameters.cpu-image}}"
        command: [python, /opt/preparation/cleanup_checkpoints.py]
        args:
          - /workspace
          - "{{inputs.parameters.run-name}}"
        resources:
          requests: {cpu: 250m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: tmp
            mountPath: /tmp

    - name: prepare-images
      steps:
        - - name: resume-checkpoints
            template: resume-checkpoints
            when: "{{=workflow.parameters['resume-run-id'] != workflow.name}}"
        - - name: prepare-images
            template: run-prepare-images

    - name: run-prepare-images
      retryStrategy:
        limit: "2"
        retryPolicy: OnFailure
      container:
        image: "{{workflow.parameters.cpu-image}}"
        command: [python, /opt/preparation/prepare_s3.py]
        args:
          - /workspace/{{workflow.name}}/prepared
          - --bucket
          - "$(PREPARATION_BUCKET)"
          - --endpoint-url
          - "$(PREPARATION_S3_ENDPOINT_URL)"
          # Howard's cold Ceph endpoint uses HTTP inside the cluster.
          - --allow-http
          - --region
          - "$(PREPARATION_REGION)"
          - --raw-prefix
          - "{{workflow.parameters.raw-prefix}}"
          - --code-revision
          - "{{workflow.parameters.code-revision}}"
          - --duplicate-conflicts
          - "{{workflow.parameters.duplicate-conflicts}}"
          - --invalid-images
          - "{{workflow.parameters.invalid-images}}"
          - --checkpoint-dir
          - /workspace/{{workflow.name}}/prepared
        envFrom:
          - secretRef:
              name: nachet-preparation-cold-s3
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "2", memory: 4Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: tmp
            mountPath: /tmp

    - name: audit-checksums
      inputs:
        parameters:
          - name: index-run-id
            description: >-
              Argo workflow name of the run that completed prepare-images
              and wrote index.coco.json. Direct audit-checksums reads that index.
              Defaults to resume-run-id.
            default: "{{workflow.parameters.resume-run-id}}"
      retryStrategy:
        limit: "2"
        retryPolicy: OnFailure
      container:
        image: "{{workflow.parameters.cpu-image}}"
        command: [python, /opt/preparation/audit_s3.py]
        args:
          - /workspace/{{inputs.parameters.index-run-id}}/prepared/index.coco.json
          - --report-path
          - /workspace/{{workflow.name}}/prepared/checksum-audit.json
          - --bucket
          - "$(PREPARATION_BUCKET)"
          - --endpoint-url
          - "$(PREPARATION_S3_ENDPOINT_URL)"
          - --allow-http
          - --region
          - "$(PREPARATION_REGION)"
        envFrom:
          - secretRef:
              name: nachet-preparation-cold-s3
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "2", memory: 4Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: tmp
            mountPath: /tmp

    - name: prelabel
      inputs:
        parameters:
          - name: index-run-id
            description: >-
              Argo workflow name of the run that completed prepare-images
              and wrote index.coco.json. Direct prelabel reads that index and writes
              draft.coco.json under its own workflow name. Defaults to resume-run-id.
            default: "{{workflow.parameters.resume-run-id}}"
      steps:
        - - name: resume-checkpoints
            template: resume-checkpoints
            when: "{{=workflow.parameters['resume-run-id'] != workflow.name}}"
        - - name: prelabel
            template: run-prelabel
            arguments:
              parameters:
                - name: index-run-id
                  value: "{{inputs.parameters.index-run-id}}"

    - name: run-prelabel
      inputs:
        parameters:
          - name: index-run-id
      retryStrategy:
        limit: "2"
        retryPolicy: OnFailure
      synchronization:
        mutexes:
          - name: nachet-training-{{workflow.parameters.gpu-node}}
      nodeSelector:
        kubernetes.io/hostname: "{{workflow.parameters.gpu-node}}"
      container:
        image: "{{workflow.parameters.sam3-image}}"
        command: [python, /opt/preparation/prelabel.py]
        args:
          - /workspace/{{inputs.parameters.index-run-id}}/prepared/index.coco.json
          - "s3://$(PREPARATION_BUCKET)"
          - /workspace/{{workflow.name}}/prepared/draft.coco.json
          - --endpoint-url
          - "$(PREPARATION_S3_ENDPOINT_URL)"
          - --allow-http
          - --region
          - "$(PREPARATION_REGION)"
          - --model-path
          - /workspace/{{workflow.name}}/models/sam3_hf_transformers
          - --model-source
          - "s3://$(MODEL_BUCKET)/base/sam3_hf_transformers"
          - --model-revision
          - "{{workflow.parameters.model-revision}}"
          - --code-revision
          - "{{workflow.parameters.code-revision}}"
          - --device
          - cuda
          - --checkpoint-dir
          - /workspace/{{workflow.name}}/prepared/prelabel-checkpoints
        envFrom:
          - secretRef:
              name: nachet-preparation-cold-s3
        resources:
          requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
          limits: {cpu: "4", memory: 16Gi, nvidia.com/gpu: "1"}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: tmp
            mountPath: /tmp

    - name: register-for-review
      inputs:
        parameters:
          - name: draft-run-id
            description: >-
              Argo workflow name of the run where prelabel wrote draft.coco.json.
              Direct register-for-review imports that draft. Defaults to resume-run-id.
      container:
        image: "{{workflow.parameters.registration-image}}"
        command: [python, /opt/preparation/register_fiftyone.py]
        args:
          - "{{workflow.parameters.dataset-name}}"
          - /workspace/{{inputs.parameters.draft-run-id}}/prepared/draft.coco.json
          - --server-media-root
          - "$(PREPARATION_SERVER_MEDIA_ROOT)"
        envFrom:
          - secretRef:
              name: nachet-preparation-cold-s3
        resources:
          requests: {cpu: 250m, memory: 1Gi}
          limits: {cpu: "1", memory: 4Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
            readOnly: true
          - name: tmp
            mountPath: /tmp
