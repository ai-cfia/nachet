---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nachet-classifier-training
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: nachet-classifier-training
    app.kubernetes.io/part-of: nachet
spec:
  entrypoint: classifier-training
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - name: external-validation-dir
        description: >-
          External validation image folder below inputs, evaluated after
          checkpoint selection. Separate from the training holdout.
          Leave as none to run training and checkpoint review only.
        value: none
      - name: validation-dir
        description: >-
          Validation image folder below inputs, or none to reserve 15% of
          training images for validation.
        value: none
      - name: train-dir
        description: >-
          Training folder below inputs, with one subfolder per species.
        value: Training
      - name: model-path
        description: Base model directory below the prepared input directory.
        value: model
      - name: run-profile
        description: >-
          Smoke uses 1 epoch and at most 32 training and 16 validation images.
          Full uses 50 epochs and all images.
          Parameters below override these defaults.
        value: smoke
        enum:
          - smoke
          - full
      - name: gpu-node
        description: >-
          GPU node used for training.
          Node selection does not change training defaults.
        value: ai-lab-1
        enum:
          - ai-lab-1
          - ai-lab-2
          - ai-lab-3
      - name: epochs
        description: >-
          Epochs: smoke=1, full=50. Enter a positive integer to override.
        value: profile-default
      - name: checkpoint-retention
        description: >-
          Checkpoints to keep: smoke=1, full=50.
          Enter a positive integer to override.
        value: profile-default
      - name: batch-size
        description: >-
          Images per device per step: smoke=2, full=80.
          Enter a positive integer to override.
        value: profile-default
      - name: gradient-accumulation-steps
        description: >-
          Steps before a model update: 1 for both profiles.
          Enter a positive integer to override.
        value: profile-default
      - name: warmup-steps
        description: >-
          Warm-up steps: smoke=0, full=1000.
          Enter a non-negative integer to override.
        value: profile-default
      - name: learning-rate
        description: >-
          Learning rate: 0.000007 for both profiles.
          Enter a positive number to override.
        value: profile-default
      - name: seed
        description: >-
          Random seed: 2438 for both profiles.
          Enter a non-negative integer to override.
        value: profile-default
      - name: resume-run-id
        description: Earlier workflow run to resume, or none for a new run.
        value: none
      - name: resume-checkpoint
        description: Checkpoint from the earlier run, or latest.
        value: latest
  templates:
    - name: classifier-training
      steps:
        - - name: train
            template: train
            arguments:
              parameters:
                - name: gpu-node
                  value: "{{workflow.parameters.gpu-node}}"
        - - name: list-checkpoints
            template: list-checkpoints
        - - name: review-checkpoints
            template: checkpoint-review
            arguments:
              parameters:
                - name: selected-checkpoint-1
                  value: >-
                    {{steps.list-checkpoints.outputs.parameters.checkpoint-options}}
                - name: selected-checkpoint-2
                  value: >-
                    {{steps.list-checkpoints.outputs.parameters.optional-checkpoint-options}}
                - name: selected-checkpoint-3
                  value: >-
                    {{steps.list-checkpoints.outputs.parameters.optional-checkpoint-options}}
        - - name: check-checkpoint-selections
            template: check-checkpoint-selections
            arguments:
              parameters:
                - name: checkpoint-options
                  value: >-
                    {{steps.list-checkpoints.outputs.parameters.checkpoint-options}}
                - name: selected-checkpoint-1
                  value: >-
                    {{steps.review-checkpoints.outputs.parameters.selected-checkpoint-1}}
                - name: selected-checkpoint-2
                  value: >-
                    {{steps.review-checkpoints.outputs.parameters.selected-checkpoint-2}}
                - name: selected-checkpoint-3
                  value: >-
                    {{steps.review-checkpoints.outputs.parameters.selected-checkpoint-3}}
        - - name: evaluate-checkpoints
            template: evaluate-checkpoint
            when: "{{=workflow.parameters['external-validation-dir'] != 'none'}}"
            withParam: >-
              {{steps.check-checkpoint-selections.outputs.parameters.selected-checkpoints}}
            arguments:
              parameters:
                - name: checkpoint
                  value: "{{item}}"
                - name: mlflow-run-id
                  value: "{{steps.train.outputs.parameters.mlflow-run-id}}"
      outputs:
        parameters:
          - name: mlflow-run-id
            valueFrom:
              parameter: "{{steps.train.outputs.parameters.mlflow-run-id}}"
          - name: mlflow-run-url
            valueFrom:
              parameter: "{{steps.train.outputs.parameters.mlflow-run-url}}"
          - name: checkpoint-options
            valueFrom:
              parameter: >-
                {{steps.list-checkpoints.outputs.parameters.checkpoint-options}}
          - name: selected-checkpoints
            valueFrom:
              parameter: >-
                {{steps.check-checkpoint-selections.outputs.parameters.selected-checkpoints}}

    - name: train
      inputs:
        parameters:
          - name: gpu-node
      outputs:
        parameters:
          - name: mlflow-run-id
            globalName: mlflow-run-id
            valueFrom:
              path: "/runs/{{workflow.name}}/mlflow-run-id"
          - name: mlflow-run-url
            globalName: mlflow-run-url
            valueFrom:
              path: "/runs/{{workflow.name}}/mlflow-run-url"
      retryStrategy:
        limit: "2"
        retryPolicy: OnFailure
      synchronization:
        mutexes:
          - name: nachet-training-{{inputs.parameters.gpu-node}}
      nodeSelector:
        kubernetes.io/hostname: "{{inputs.parameters.gpu-node}}"
      container:
        image: ghcr.io/ai-cfia/nachet-classifier-trainer:main
        imagePullPolicy: Always
        args:
          - --dataset-root
          - /inputs
          - --train-dir
          - "{{workflow.parameters.train-dir}}"
          - --validation-dir
          - "{{workflow.parameters.validation-dir}}"
          - --model-path
          - "{{workflow.parameters.model-path}}"
          - --run-profile
          - "{{workflow.parameters.run-profile}}"
          - --epochs
          - "{{workflow.parameters.epochs}}"
          - --checkpoint-retention
          - "{{workflow.parameters.checkpoint-retention}}"
          - --batch-size
          - "{{workflow.parameters.batch-size}}"
          - --gradient-accumulation-steps
          - "{{workflow.parameters.gradient-accumulation-steps}}"
          - --warmup-steps
          - "{{workflow.parameters.warmup-steps}}"
          - --learning-rate
          - "{{workflow.parameters.learning-rate}}"
          - --seed
          - "{{workflow.parameters.seed}}"
          - --run-id
          - "{{workflow.name}}"
          - --runs-root
          - /runs
          - --resume-run-id
          - "{{workflow.parameters.resume-run-id}}"
          - --resume-checkpoint
          - "{{workflow.parameters.resume-checkpoint}}"
        envFrom:
          - secretRef:
              name: nachet-training-s3
        env:
          - name: MLFLOW_TRACKING_URI
            value: http://mlflow.mlflow.svc.cluster.local:5000
          - name: MLFLOW_EXPERIMENT_NAME
            value: Swin-classifier-training
          - name: MLFLOW_PUBLIC_URL
            value: https://mlflow.inspection.alpha.canada.ca
          - name: HF_HOME
            value: /scratch/huggingface
          - name: XDG_CACHE_HOME
            value: /scratch/cache
        resources:
          requests:
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: training-storage
            mountPath: /inputs
            subPath: nachet/classifier-training/inputs
            readOnly: true
          - name: training-storage
            mountPath: /runs
            subPath: nachet/classifier-training/runs
          - name: scratch
            mountPath: /scratch
          - name: tmp
            mountPath: /tmp

    - name: evaluate-checkpoint
      inputs:
        parameters:
          - name: checkpoint
          - name: mlflow-run-id
      retryStrategy:
        limit: "2"
        retryPolicy: OnFailure
      synchronization:
        mutexes:
          - name: nachet-training-{{workflow.parameters.gpu-node}}
      nodeSelector:
        kubernetes.io/hostname: "{{workflow.parameters.gpu-node}}"
      container:
        image: ghcr.io/ai-cfia/nachet-classifier-trainer:main
        imagePullPolicy: Always
        workingDir: /inputs
        command: [python, -m, evaluation_runtime]
        args:
          - --parent-run-id
          - "{{inputs.parameters.mlflow-run-id}}"
          - --checkpoint
          - "{{inputs.parameters.checkpoint}}"
          - --output-dir
          - "/runs/{{workflow.name}}/evaluation/{{inputs.parameters.checkpoint}}"
          - --
          - python
          - -m
          - validation_classifier
          - --model_path
          - "/runs/{{workflow.name}}/trainer-output/{{inputs.parameters.checkpoint}}"
          - --test_data_path
          - "/inputs/{{workflow.parameters.external-validation-dir}}"
          - --output_path
          - "/runs/{{workflow.name}}/evaluation/{{inputs.parameters.checkpoint}}/reports/{{inputs.parameters.checkpoint}}"
        envFrom:
          - secretRef:
              name: nachet-training-s3
        env:
          - name: MLFLOW_TRACKING_URI
            value: http://mlflow.mlflow.svc.cluster.local:5000
          - name: MLFLOW_EXPERIMENT_NAME
            value: Swin-classifier-training
          - name: MLFLOW_PUBLIC_URL
            value: https://mlflow.inspection.alpha.canada.ca
          - name: HF_HOME
            value: /scratch/huggingface
          - name: MPLCONFIGDIR
            value: /scratch/matplotlib
          - name: MPLBACKEND
            value: Agg
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: XDG_CACHE_HOME
            value: /scratch/cache
        resources:
          requests:
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: training-storage
            mountPath: /inputs
            subPath: nachet/classifier-training/inputs
            readOnly: true
          - name: training-storage
            mountPath: /runs
            subPath: nachet/classifier-training/runs
          - name: scratch
            mountPath: /scratch
          - name: tmp
            mountPath: /tmp

    - name: list-checkpoints
      outputs:
        parameters:
          - name: checkpoint-options
            globalName: checkpoint-options
            valueFrom:
              path: /tmp/checkpoint-options
          - name: optional-checkpoint-options
            valueFrom:
              path: /tmp/optional-checkpoint-options
      nodeSelector:
        kubernetes.io/hostname: "{{workflow.parameters.gpu-node}}"
      container:
        image: ghcr.io/ai-cfia/nachet-classifier-trainer:main
        imagePullPolicy: Always
        command:
          - python
          - -m
          - checkpoints
        args:
          - --run-id
          - "{{workflow.name}}"
          - list
          - --output
          - /tmp/checkpoint-options
          - --optional-output
          - /tmp/optional-checkpoint-options
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: training-storage
            mountPath: /runs
            subPath: nachet/classifier-training/runs
            readOnly: true
          - name: tmp
            mountPath: /tmp

    - name: checkpoint-review
      inputs:
        parameters:
          - name: selected-checkpoint-1
            description: >-
              First checkpoint selected after reviewing the MLflow run.
          - name: selected-checkpoint-2
            description: >-
              Optional second checkpoint. Choose a different checkpoint or none.
          - name: selected-checkpoint-3
            description: >-
              Optional third checkpoint. Choose a different checkpoint or none.
      outputs:
        parameters:
          - name: selected-checkpoint-1
            valueFrom:
              supplied: {}
          - name: selected-checkpoint-2
            valueFrom:
              supplied: {}
          - name: selected-checkpoint-3
            valueFrom:
              supplied: {}
      suspend: {}

    - name: check-checkpoint-selections
      inputs:
        parameters:
          - name: checkpoint-options
          - name: selected-checkpoint-1
          - name: selected-checkpoint-2
          - name: selected-checkpoint-3
      outputs:
        parameters:
          - name: selected-checkpoints
            globalName: selected-checkpoints
            valueFrom:
              path: /tmp/selected-checkpoints
      nodeSelector:
        kubernetes.io/hostname: "{{workflow.parameters.gpu-node}}"
      container:
        image: ghcr.io/ai-cfia/nachet-classifier-trainer:main
        imagePullPolicy: Always
        command:
          - python
          - -m
          - checkpoints
        args:
          - --run-id
          - "{{workflow.name}}"
          - validate-selection
          - --checkpoint-options
          - "{{inputs.parameters.checkpoint-options}}"
          - --selected-checkpoint
          - "{{inputs.parameters.selected-checkpoint-1}}"
          - "{{inputs.parameters.selected-checkpoint-2}}"
          - "{{inputs.parameters.selected-checkpoint-3}}"
          - --output
          - /tmp/selected-checkpoints
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: training-storage
            mountPath: /runs
            subPath: nachet/classifier-training/runs
            readOnly: true
          - name: tmp
            mountPath: /tmp
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: training-storage
      persistentVolumeClaim:
        claimName: nachet-training-workspace-pvc
    - name: scratch
      emptyDir: {}
    - name: tmp
      emptyDir: {}
