[project]
name = "nachet-preparation"
version = "0.1.0"
description = "Dataset preparation commands"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "opencv-python-headless==4.14.0.94",
    "pillow==13.0.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]
sam3 = ["torch==2.9.0", "torchvision==0.24.0", "transformers==5.16.1"]
fiftyone = ["fiftyone==1.22.1"]
storage = ["boto3>=1.40.55,<2", "botocore>=1.40.55,<2", "nachet-blob"]

[tool.uv.sources]
nachet-blob = { path = "../blob", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
