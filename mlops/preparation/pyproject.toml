[project]
name = "nachet-preparation"
version = "0.1.0"
description = "Dataset preparation commands"
requires-python = ">=3.15,<3.16"
dependencies = [
    "numpy==2.5.4",
    "opencv-python-headless==4.14.0.94",
    "pillow==13.0.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]
sam3 = ["torch==2.9.0", "torchvision==0.29.2", "transformers==5.22.1"]
fiftyone = ["fiftyone==1.22.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
