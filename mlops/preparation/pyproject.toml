[project]
name = "nachet-preparation"
version = "0.1.0"
description = "Dataset preparation commands"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow==13.0.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
