[project]
name = "nachet-preparation"
version = "1.0.0"
description = "Dataset preparation commands"
requires-python = ">=3.15,<3.16"
dependencies = [
    "numpy==2.5.5",
    "opencv-python-headless==4.14.0.94",
    "pillow==13.0.0",
    "semver==3.1.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]
sam3 = ["torch==2.9.0", "torchvision==0.29.2", "transformers==5.24.0"]
fiftyone = ["fiftyone==1.22.1"]
storage = ["boto3>=1.40.55,<2", "botocore>=1.40.55,<2", "nachet-blob"]

[tool.uv.sources]
nachet-blob = { path = "../blob", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
