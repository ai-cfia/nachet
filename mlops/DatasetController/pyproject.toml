[build-system]
requires = ["setuptools>=80,<100"]
build-backend = "setuptools.build_meta"

[project]
name = "nachet-dataset-controller"
version = "0.1.0"
description = "Standalone controller for immutable reviewed dataset releases"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nachet-blob",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "pydantic==2.13.0",
    "sqlalchemy[asyncio]>=2.0.43,<3",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "pillow==13.0.0",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.13,<1",
]

[tool.setuptools]
packages = [
    "dataset_controller",
    "dataset_controller.models",
    "dataset_controller.services",
    "dataset_controller.repositories",
    "dataset_controller.config",
    "dataset_controller.utility",
]
package-dir = { dataset_controller = "." }
include-package-data = false

[tool.uv.sources]
nachet-blob = { path = "../blob", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["dataset_controller"]
