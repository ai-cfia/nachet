[project]
name = "nachet-export"
version = "0.1.0"
description = "Local checkpoint export and browser model preparation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.4.3",
    "onnx==1.21.0",
    "onnxconverter-common==1.16.0",
    "onnxruntime==1.24.4",
    "optimum-onnx==0.1.0",
    "pillow==12.1.1",
    "safetensors==0.8.0",
    "torch==2.8.0",
    # Saved fast image processors use torchvision's preprocessing backend.
    "torchvision==0.23.0",
    # optimum-onnx 0.1.0 requires transformers<4.58; training uses 5.16.1.
    "transformers==4.57.6",
]

[dependency-groups]
test = ["pytest==9.0.2"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { url = "https://download.pytorch.org/whl/cpu/torch-2.8.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl" }
torchvision = { url = "https://download.pytorch.org/whl/cpu/torchvision-0.23.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl" }
