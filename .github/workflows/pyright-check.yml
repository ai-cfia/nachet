---
name: Reusable Pyright Type Check
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Working directory for pyright type checking"
        required: false
        default: "backend"
        type: string
      python-version:
        description: "Python version to use"
        required: false
        default: "3.13"
        type: string
      uv-version:
        description: "uv version to use"
        required: false
        default: "latest"
        type: string
      fail-on-error:
        description: "Whether to fail the workflow on pyright errors"
        required: false
        default: true
        type: boolean

jobs:
  pyright-check:
    name: Pyright Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@e8b52af86e46cb518daf4b47877e582bc9e37b8b
        with:
          version: ${{ inputs.uv-version }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run pyright
        run: |
          echo "Running pyright type checker..."
          if ${{ inputs.fail-on-error }}; then
            uv run pyright
          else
            uv run pyright || true
          fi

      - name: Check pyright results
        if: always()
        run: |
          echo "Pyright type checking completed"
          if ${{ inputs.fail-on-error }}; then
            echo "Failure mode: Errors will fail the workflow"
          else
            echo "Warning mode: Errors will not fail the workflow"
          fi
