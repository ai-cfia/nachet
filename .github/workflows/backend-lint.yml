---
name: backend lint
permissions:
  contents: write
  pull-requests: write
  actions: read

on:
  pull_request:
    types:
      - opened
      - closed
      - synchronize
    paths:
      - 'backend/**'
      - 'backend/pyproject.toml'
      - '.github/workflows/backend-*'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'backend/pyproject.toml'
      - '.github/workflows/backend-*'

defaults:
  run:
    working-directory: backend

jobs:
  nachet-pyproject-version-bump:
    # if: github.event.pull_request.merged != true
    name: nachet-backend-pyproject-version-bump
    uses: ai-cfia/github-workflows/.github/workflows/workflow-version-bump-python-mono.yml@main
    secrets: inherit
    with:
      pyproject-path: 'pyproject.toml'
      package-name: 'nachet-backend'
      working-directory: backend
  backend-lint:
    name: backend-lint-test-python
    uses: ai-cfia/github-workflows/.github/workflows/workflow-lint-python-mono.yml@main
    secrets: inherit
    with:
      working-directory: backend
  # bytebase-sql-review:
  #   uses: ai-cfia/github-workflows/.github/workflows/workflow-bytebase-sql-review.yml@main
  #   secrets: inherit
  mkd-check:
    name: workflow-markdown-check
    uses: ai-cfia/github-workflows/.github/workflows/workflow-markdown-check-mono.yml@main
    secrets: inherit
    with:
      working-directory: backend
      md-link-config-file-path: '.mlc_config.json'
  yaml-check:
    name: workflow-yaml-check
    uses: ai-cfia/github-workflows/.github/workflows/workflow-yaml-check-mono.yml@main
    secrets: inherit
    with:
      working-directory: backend
  uv-lock-check:
    name: Check uv.lock is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@142240426d0e82f3e584603c3aa194c582f5aed3
        with:
          version: "latest"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check if uv.lock is up to date
        run: |
          # Generate a new lock file and compare with existing
          uv lock --check
        working-directory: backend

  uv-sbom-check:
    name: Check SBOM is up to date
    uses: ./.github/workflows/uv-sbom-check.yml
    secrets: inherit
    with:
      working-directory: backend

  sbom-security-scan:
    needs: uv-sbom-check
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Ensure SBOM exists (skip scan if missing)
        run: |
          if [ ! -f backend/sbom.json ]; then
            echo "SBOM not present (likely failed validation job); skipping scan.";
            echo "No SBOM file found" > sbom-scan-skip.log
            exit 0
          fi
      - uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        name: SBOM Security Scan
        id: scan
        with:
          sbom: backend/sbom.json
          fail-build: false
      - name: Check SBOM scan results
        run: cat ${{ steps.scan.outputs.sarif }}
      - name: Upload SBOM scan results
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
