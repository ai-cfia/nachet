---
name: backend lint
permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - closed
      - synchronize
    paths:
      - "backend/**"
      - "backend/pyproject.toml"
      - ".github/workflows/backend-*"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "backend/pyproject.toml"
      - ".github/workflows/backend-*"

defaults:
  run:
    working-directory: backend

jobs:
  nachet-pyproject-version-bump:
    # if: github.event.pull_request.merged != true
    name: nachet-backend-pyproject-version-bump
    uses: ai-cfia/github-workflows/.github/workflows/workflow-version-bump-python-mono.yml@main
    secrets: inherit
    with:
      pyproject-path: "pyproject.toml"
      package-name: "nachet-backend"
      working-directory: backend

  bump-version-renovate:
    needs: [nachet-pyproject-version-bump]
    # Failure of nachet-pyproject-version-bump indicates that version in pyproject.toml has not been updated.
    if: ${{ !cancelled() && (github.event.pull_request.user.login == 'renovate[bot]' || github.event.pull_request.user.login == 'github-actions[bot]') && needs.nachet-pyproject-version-bump.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          
      - name: Install uv
        uses: astral-sh/setup-uv@5c62c5926145985eec91f09e2e0a75f40daed929
        with:
          version: "latest"

      - name: Bump version for Renovate PRs
        run: |
          uv version --bump patch

      - name: Commit & push changes
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321
        with:
          message: "chore: bump backend version for Renovate PRs"
          add: "."
          pull: "--rebase --autostash"
          author_name: "github-actions[bot]"
          author_email: "actions@github.com"

  backend-lint:
    name: backend-lint-test-python
    uses: ai-cfia/github-workflows/.github/workflows/workflow-lint-python-mono.yml@main
    secrets: inherit
    with:
      working-directory: backend
  # bytebase-sql-review:
  #   uses: ai-cfia/github-workflows/.github/workflows/workflow-bytebase-sql-review.yml@main
  #   secrets: inherit

  mkd-check:
    name: workflow-markdown-check
    uses: ai-cfia/github-workflows/.github/workflows/workflow-markdown-check-mono.yml@main
    secrets: inherit
    with:
      working-directory: backend
      md-link-config-file-path: ".mlc_config.json"

  yaml-check:
    name: workflow-yaml-check
    uses: ai-cfia/github-workflows/.github/workflows/workflow-yaml-check-mono.yml@main
    secrets: inherit
    with:
      working-directory: backend

  uv-lock-check:
    name: Check uv.lock is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@5c62c5926145985eec91f09e2e0a75f40daed929
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check if uv.lock is up to date
        run: |
          # Generate a new lock file and compare with existing
          uv lock --check
        working-directory: backend

  sbom-security-scan:
    uses: ai-cfia/github-workflows/.github/workflows/workflow-generate-backend-sbom.yml@main
    secrets: inherit

  pyright-check:
    name: Python Type Check
    uses: ./.github/workflows/pyright-check.yml
    secrets: inherit
    with:
      working-directory: backend
