name: Frontend Lint
permissions:
  contents: write
  pull-requests: write
  actions: write

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-*.yml"
    types:
      - opened
      - closed
      - synchronize
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-*.yml"

concurrency:
  group: frontend-lint-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_MONOREPO: true
  FRONTEND_PATH: frontend
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nachet-frontend

defaults:
  run:
    working-directory: frontend

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.versions.outputs.node-version }}
      npm-version: ${{ steps.versions.outputs.npm-version }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR branch version
        id: pr-version
        run: |
          PR_VERSION=$(jq -r '.version' package.json)
          echo "PR version: $PR_VERSION"
          echo "version=$PR_VERSION" >> $GITHUB_OUTPUT

      - name: Get latest version
        id: get_latest_version
        run: |
          package_name="nachet-frontend"
          if [ -z "$package_name" ]; then
            tags=$(git tag --list "v*" --sort=-creatordate | head -n 10)
          else
            tags=$(git tag --list "${package_name}-v*" --sort=-creatordate | head -n 10)
          fi

          latest_version=""
          for tag in $tags; do
            version=$(echo "$tag" | grep -oP '(?<=-v)[0-9]+\.[0-9]+\.[0-9]+')
            if [ -n "$version" ]; then
              latest_version="$version"
              break
            fi
          done

          if [ -z "$latest_version" ]; then
            latest_version="0.0.0"
          fi
          echo "latest_version=$latest_version" >> $GITHUB_OUTPUT
          echo "Target branch version: $TARGET_VERSION"

      - name: Compare versions
        if: github.event_name == 'pull_request' && github.event.action != 'closed' && !github.event.pull_request.merged
        run: |
          PR_VERSION="${{ steps.pr-version.outputs.version }}"
          TARGET_VERSION="${{ steps.get_latest_version.outputs.latest_version }}"

          echo "Comparing versions:"
          echo "  Target branch (${{ github.base_ref }}): $TARGET_VERSION"
          echo "  PR branch: $PR_VERSION"

          # Function to compare semantic versions
          compare_versions() {
            local version1=$1
            local version2=$2
            
            # Split versions into arrays
            IFS='.' read -ra V1 <<< "$version1"
            IFS='.' read -ra V2 <<< "$version2"
            
            # Compare each component
            for i in {0..2}; do
              v1_part=${V1[i]:-0}
              v2_part=${V2[i]:-0}
              
              if [ "$v1_part" -gt "$v2_part" ]; then
                return 0  # version1 > version2
              elif [ "$v1_part" -lt "$v2_part" ]; then
                return 1  # version1 < version2
              fi
            done
            
            return 1  # versions are equal
          }

          if [ "$PR_VERSION" = "$TARGET_VERSION" ]; then
            echo "❌ Version has not been incremented!"
            echo "The version in frontend/package.json ($PR_VERSION) is the same as in the target branch."
            echo "Please increment the version before merging this PR."
            exit 1
          elif compare_versions "$PR_VERSION" "$TARGET_VERSION"; then
            echo "✅ Version has been incremented correctly!"
            echo "  $TARGET_VERSION → $PR_VERSION"
          else
            echo "❌ Version appears to have been decremented!"
            echo "The PR version ($PR_VERSION) is lower than the target branch version ($TARGET_VERSION)."
            echo "Please ensure the version is incremented properly."
            exit 1
          fi

      - name: Extract versions from package.json
        id: versions
        run: |
          NODE_VERSION=$(jq -r '.engines.node' package.json | sed 's/\^//')
          NPM_VERSION=$(jq -r '.engines.npm' package.json | sed 's/\^//')
          echo "Detected Node.js version: $NODE_VERSION"
          echo "Detected npm version: $NPM_VERSION"
          echo "node-version=$NODE_VERSION" >> $GITHUB_OUTPUT
          echo "npm-version=$NPM_VERSION" >> $GITHUB_OUTPUT

  check-package-lock:
    needs: [versions]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.versions.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install specific npm version
        run: npm install -g npm@${{ needs.versions.outputs.npm-version }}

      - name: Check if package-lock.json is up to date
        run: |
          echo "🔍 Checking if package-lock.json needs updating..."

          # Create a backup of the current package-lock.json
          cp package-lock.json package-lock.json.backup

          # Run npm install to regenerate package-lock.json
          npm install --package-lock-only

          # Compare the files
          if ! cmp -s package-lock.json package-lock.json.backup; then
            echo "❌ package-lock.json is out of date!"
            echo ""
            echo "The package-lock.json file needs to be updated."
            echo "Please run 'npm install' locally and commit the updated package-lock.json file."
            echo ""
            echo "Differences found:"
            diff package-lock.json.backup package-lock.json || true
            exit 1
          else
            echo "✅ package-lock.json is up to date!"
          fi

  frontend-lint-test:
    needs: [versions, check-package-lock]
    uses: ai-cfia/github-workflows/.github/workflows/workflow-lint-test-node-mono.yml@main
    with:
      working-directory: frontend
      node-version: ${{ needs.versions.outputs.node-version }}
      npm-version: ${{ needs.versions.outputs.npm-version }}
    secrets: inherit

  markdown-check:
    needs: [versions]
    uses: ai-cfia/github-workflows/.github/workflows/workflow-markdown-check-mono.yml@main
    with:
      working-directory: frontend
      md-link-config-file-path: ".mlc_config.json"
    secrets: inherit

  trigger-release:
    name: Trigger release workflow
    # This job triggers the publish workflow automatically when a PR is merged to main
    # The publish workflow can also be triggered manually via workflow_dispatch
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Release Workflow for Nachet Frontend
        run: |
          gh workflow run frontend-release.yml \
          --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-sbom-check:
    name: Check SBOM is up to date
    needs: [versions]
    uses: ./.github/workflows/npm-sbom-check.yml
    secrets: inherit
    with:
      working-directory: frontend
      node-version: ${{ needs.versions.outputs.node-version }}
      npm-version: ${{ needs.versions.outputs.npm-version }}

  sbom-security-scan:
    needs: npm-sbom-check
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Ensure SBOM exists (skip scan if missing)
        run: |
          if [ ! -f frontend/sbom.json ]; then
            echo "SBOM not present (likely failed validation job); skipping scan.";
            echo "No SBOM file found" > sbom-scan-skip.log
            exit 0
          fi
      - uses: anchore/scan-action@dc00f97ec900ac3c2c1b47c2d9d500aeab99cc14
        name: SBOM Security Scan
        id: scan
        with:
          sbom: frontend/sbom.json
          fail-build: false
      - name: Check SBOM scan results
        run: cat ${{ steps.scan.outputs.sarif }}
      - name: Upload SBOM scan results
        uses: github/codeql-action/upload-sarif@v3
        # there is a bug https://github.com/microsoft/sarif-sdk/issues/2770
        # grype probably needa to point to the vuln location for this to work properly
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
