name: Frontend Lint
permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-*.yml"
    types:
      - opened
      - closed
      - synchronize
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-*.yml"

env:
  IS_MONOREPO: true
  FRONTEND_PATH: frontend
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nachet-frontend

defaults:
  run:
    working-directory: frontend

jobs:
  versions:
    uses: ./.github/workflows/reusable-frontend-versions.yml
    with:
      working-directory: frontend
      package-name: nachet-frontend
      skip-version-check: false

  bump-version-renovate:
    if: ${{ !cancelled() && (github.event.pull_request.user.login == 'renovate[bot]' || github.event.pull_request.user.login == 'github-actions[bot]') && needs.nachet-pyproject-version-bump.result == 'failure' }}
    needs: [versions]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.versions.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Increment version for Renovate PRs
        run: |
          echo "current version: ${{ needs.versions.outputs.app-version }}"
          npm version "$(jq -r '.version' package.json | awk -F. -v OFS=. '{ $NF++; print }')" --no-git-tag-version
          echo "new version: $(jq -r '.version' package.json)"

      - name: Commit & push changes
        uses: EndBug/add-and-commit@62806537b45381f4b1475ec463d5e2106d9d3110
        with:
          message: "chore: bump frontend version for Renovate PRs"
          add: "."
          author_name: "github-actions[bot]"
          author_email: "actions@github.com"


  check-package-lock:
    needs: [versions, bump-version-renovate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.versions.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install specific npm version
        run: npm install -g npm@${{ needs.versions.outputs.npm-version }}

      - name: Check if package-lock.json is up to date
        run: |
          echo "🔍 Checking if package-lock.json needs updating..."

          # Create a backup of the current package-lock.json
          cp package-lock.json package-lock.json.backup

          # Run npm install to regenerate package-lock.json
          npm install --package-lock-only

          # Compare the files
          if ! cmp -s package-lock.json package-lock.json.backup; then
            echo "❌ package-lock.json is out of date!"
            echo ""
            echo "The package-lock.json file needs to be updated."
            echo "Please run 'npm install' locally and commit the updated package-lock.json file."
            echo ""
            echo "Differences found:"
            diff package-lock.json.backup package-lock.json || true
            exit 1
          else
            echo "✅ package-lock.json is up to date!"
          fi

  frontend-lint-test:
    needs: [versions, check-package-lock]
    uses: ai-cfia/github-workflows/.github/workflows/workflow-lint-test-node-mono.yml@main
    with:
      working-directory: frontend
      node-version: ${{ needs.versions.outputs.node-version }}
      npm-version: ${{ needs.versions.outputs.npm-version }}
    secrets: inherit

  sbom-security-scan:
    needs: [versions]
    uses: ai-cfia/github-workflows/.github/workflows/workflow-generate-frontend-sbom.yml@main
    secrets: inherit

  markdown-check:
    needs: [versions]
    uses: ai-cfia/github-workflows/.github/workflows/workflow-markdown-check-mono.yml@main
    with:
      working-directory: frontend
      md-link-config-file-path: ".mlc_config.json"
    secrets: inherit

  trigger-release:
    name: Trigger release workflow
    # This job triggers the publish workflow automatically when a PR is merged to main
    # The publish workflow can also be triggered manually via workflow_dispatch
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Trigger Release Workflow for Nachet Frontend
        run: |
          gh workflow run frontend-release.yml \
          --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
