---
name: datastore lint
permissions:
  contents: write
  pull-requests: write
  actions: read

on:
  pull_request:
    types:
      - opened
      - closed
      - synchronize
    paths:
      - 'datastore/**'
      - 'datastore/pyproject.toml'
      - '.github/workflows/datastore-*'
  push:
    branches:
      - main
    paths:
      - 'datastore/**'
      - 'datastore/pyproject.toml'
      - '.github/workflows/datastore-*'

defaults:
  run:
    working-directory: datastore

jobs:
  nachet-pyproject-version-bump:
    # if: github.event.pull_request.merged != true
    name: nachet-datastore-pyproject-version-bump
    uses: ai-cfia/github-workflows/.github/workflows/workflow-version-bump-python-mono.yml@main
    secrets: inherit
    with:
      pyproject-path: 'pyproject.toml'
      package-name: 'nachet-datastore'
      working-directory: datastore
  datastore-lint:
    name: datastore-lint-test-python
    uses: ai-cfia/github-workflows/.github/workflows/workflow-lint-python-mono.yml@main
    secrets: inherit
    with:
      working-directory: datastore
  # bytebase-sql-review:
  #   uses: ai-cfia/github-workflows/.github/workflows/workflow-bytebase-sql-review.yml@main
  #   secrets: inherit
  mkd-check:
    name: workflow-markdown-check
    uses: ai-cfia/github-workflows/.github/workflows/workflow-markdown-check-mono.yml@main
    secrets: inherit
    with:
      working-directory: datastore
      md-link-config-file-path: '.mlc_config.json'
  yaml-check:
    name: workflow-yaml-check
    uses: ai-cfia/github-workflows/.github/workflows/workflow-yaml-check-mono.yml@main
    secrets: inherit
    with:
      working-directory: datastore
  uv-lock-check:
    name: Check uv.lock is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        with:
          version: "latest"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check if uv.lock is up to date
        run: |
          # Generate a new lock file and compare with existing
          uv lock --check
        working-directory: datastore
