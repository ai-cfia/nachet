---
name: end to end tests

permissions:
  contents: read
  pull-requests: write
  actions: write

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "backend/**"
      - "frontend/**"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"

defaults:
  run:
    working-directory: .

jobs:
  end-to-end-test:
    runs-on: ubuntu-latest
    environment: e2e-test-env
    timeout-minutes: 15

    services:
      nachet-db:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      nachet-detector:
        image: wiremock/wiremock:3.13.1
        ports:
          - 5001:8080
        volumes:
          - ./e2e/mocks/nachet-detector:/home/wiremock/mappings
      nachet-15spp-classifier:
        image: wiremock/wiremock:3.13.1
        ports:
          - 5003:8080
        volumes:
          - ./e2e/mocks/nachet-15spp-classifier:/home/wiremock/mappings
      nachet-27spp-classifier:
        image: wiremock/wiremock:3.13.1
        ports:
          - 5002:8080
        volumes:
          - ./e2e/mocks/nachet-27spp-classifier:/home/wiremock/mappings
      nachet-frontend:
        image: ghcr.io/ai-cfia/nachet-frontend:0.13.2
        env:
          PUBLIC_URL: "."
          VITE_BACKEND_URL: "http://localhost:12435"
          VITE_APP_MODE: ""
          FRONTEND_DEV_PORT: 12436
        ports:
          - 12436:3000

    steps:
      - name: Chown user
        run: |
          sudo chown -R $USER:$USER $GITHUB_WORKSPACE

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite Blob Storage Emulator
        shell: bash
        run: azurite --loose --blobHost 127.0.0.1 --blobPort 10000 &

      # - name: Wait for Azurite to be ready
      #   run: |
      #     timeout 30 bash -c 'until curl -f http://127.0.0.1:10000/ 2>/dev/null; do sleep 1; done'

      - name: Install uv
        uses: astral-sh/setup-uv@9c6b5e9fb575cac8e82bb437dd7fc25a094bd85d

      - name: Install dependencies
        run: |
          cd backend
          uv sync --dev

      - name: Alembic migration to repo head
        working-directory: backend/app/db
        run: |
          uv run db_setup_test.py
        env:
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: "${{ secrets.NACHET_SCHEMA }}"

      - name: Start backend service
        run: |
          docker run -d --name nachet-backend \
            --network host \
            -e TESTING="false" \
            -e BACKEND_DEV_PORT=${{ secrets.BACKEND_DEV_PORT }} \
            -e ALEMBIC_MIGRATION_LOG_LEVEL=${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }} \
            -e SQLALCHEMY_MIGRATION_LOG_LEVEL=${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            -e DB_USER=${{ secrets.DB_USER }} \
            -e DB_HOST=${{ secrets.DB_HOST }} \
            -e DB_PORT=${{ secrets.DB_PORT }} \
            -e DEBUG=${{ secrets.DEBUG }} \
            -e NACHET_SCHEMA="${{ secrets.NACHET_SCHEMA }}" \
            -e BLOB_STORAGE_PROVIDER=${{ secrets.BLOB_STORAGE_PROVIDER }} \
            -e BLOB_STORAGE_NAME=${{ secrets.BLOB_STORAGE_NAME }} \
            -e BLOB_STORAGE_KEY=${{ secrets.BLOB_STORAGE_KEY }} \
            -e BLOB_STORAGE_ENDPOINT_PROTOCOL=${{ secrets.BLOB_STORAGE_ENDPOINT_PROTOCOL }} \
            -e BLOB_STORAGE_ENDPOINT_SUFFIX=${{ secrets.BLOB_STORAGE_ENDPOINT_SUFFIX }} \
            -e BLOB_STORAGE_ENDPOINT_BASE=${{ secrets.BLOB_STORAGE_ENDPOINT_BASE }} \
            -e NACHET_DATA="https://raw.githubusercontent.com/ai-cfia/nachet-data/main/" \
            -e NACHET_MAX_CONTENT_LENGTH="200" \
            -e NACHET_BLOB_PIPELINE_NAME="sg-nachet-pipeline-dev" \
            -e NACHET_BLOB_PIPELINE_VERSION="0.1.3" \
            -e NACHET_BLOB_PIPELINE_DECRYPTION_KEY="${{ secrets.NACHET_BLOB_PIPELINE_DECRYPTION_KEY }}" \
            -e NACHET_BLOB_ACCOUNT="${{ secrets.NACHET_BLOB_ACCOUNT }}" \
            -e NACHET_BLOB_ACCOUNT_TESTING="${{ secrets.NACHET_BLOB_ACCOUNT }}" \
            -e NACHET_BLOB_KEY="${{ secrets.NACHET_BLOB_KEY }}" \
            -e NACHET_BLOB_KEY_TESTING="${{ secrets.NACHET_BLOB_KEY }}" \
            -e NACHET_VALID_EXTENSION='["jpeg", "jpg", "png", "gif", "bmp", "tiff", "webp"]' \
            -e NACHET_VALID_DIMENSION='{"width": 1920, "height": 1080}' \
            -e DEV_USER_EMAIL="${{ secrets.DEV_USER_EMAIL }}" \
            -e NACHET_ENV="local" \
            -e NACHET_FRONTEND_PUBLIC_URL="https://nachet.inspection.alpha.canada.ca" \
            -e NACHET_FRONTEND_DEV_URL="http://localhost:12436" \
            -e BACKEND_DEV_PORT="5174" \
            -e FRONTEND_DEV_PORT="12436" \
            -p 12435:5174 \
            ghcr.io/ai-cfia/nachet-backend:205-end-to-end-testing

      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: modules-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright Binaries
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Show backend service logs
        if: failure()
        run: |
          docker ps -a
          echo "=== Backend logs ==="
          docker logs nachet-backend
          echo "=== Database logs ==="
          docker logs ${{ job.services.nachet-db.id }}
          echo "=== detector mock logs ==="
          docker logs ${{ job.services.nachet-detector.id }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
