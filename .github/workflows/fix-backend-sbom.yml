name: Fix Backend SBOM

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch PR metadata
        id: prmeta
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number("${{ github.event.inputs.pr_number }}");
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput("head_repo", pr.head.repo.full_name);
            core.setOutput("head_ref", pr.head.ref);

      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.prmeta.outputs.head_repo }}
          ref: ${{ steps.prmeta.outputs.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@dd9d748439ebdfa6b3a3ff28bac088d074755740

      - name: Install dependencies and cyclone-x
        working-directory: backend
        run: |
          uv sync --group dev --group sbom

      - name: Generate SBOM
        working-directory: backend
        run: |
          uv run cyclonedx-py environment --output-reproducible -v --sv 1.6 \
            --pyproject pyproject.toml -o sbom.json && echo "" >> sbom.json

      - name: Commit & push
        env:
          BRANCH: ${{ steps.prmeta.outputs.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/sbom.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(sbom): update backend sbom.json"
          GIT_TERMINAL_PROMPT=0 git push origin "HEAD:refs/heads/${BRANCH}"