name: Create Frontend Release

# This workflow can be triggered in two ways:
# 1. Automatically after merge on main when frontend changes are detected
# 2. Manually via workflow_dispatch for ad-hoc releases
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract versions from package.json
        id: versions
        run: |
          NODE_VERSION=$(jq -r '.engines.node' package.json | sed 's/\^//')
          NPM_VERSION=$(jq -r '.engines.npm' package.json | sed 's/\^//')
          APP_VERSION=$(jq -r '.version' package.json | sed 's/\^//')
          if [ -z "$NODE_VERSION" ] || [ -z "$NPM_VERSION" ] || [ -z "$APP_VERSION" ]; then
            echo "Error: Could not extract versions from package.json"
            exit 1
          fi
          echo "Detected Node.js version: $NODE_VERSION"
          echo "Detected npm version: $NPM_VERSION"
          echo "Detected application version: $APP_VERSION"
          echo "node-version=$NODE_VERSION" >> $GITHUB_OUTPUT
          echo "npm-version=$NPM_VERSION" >> $GITHUB_OUTPUT
          echo "app-version=$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.versions.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install specific npm version
        run: npm install -g npm@${{ steps.versions.outputs.npm-version }}

      - name: Configure Git for GitHub Actions
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Action"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Switch to the release branch
        run: |
          branch_name="release/nachet-frontend-v${{ steps.versions.outputs.app-version }}"

          # Check if branch exists locally and delete it
          if git show-ref --verify --quiet refs/heads/$branch_name; then
            echo "Branch $branch_name exists locally, deleting it"
            git branch -D $branch_name
          fi

          # Check if branch exists remotely and delete it
          if git ls-remote --heads origin $branch_name | grep -q $branch_name; then
            echo "Branch $branch_name exists remotely, deleting it"
            git push origin --delete $branch_name
          fi

          # Create and push new branch
          git checkout -b $branch_name
          git push -u origin $branch_name

      - name: Remove unnecessary files from release branch
        working-directory: .
        run: |
          echo "Files and directories before cleanup:"
          find . -maxdepth 2 -type f -o -type d | head -20

          # Validate required directories exist before cleanup
          if [ ! -d "./frontend" ]; then
            echo "Error: Required directory (frontend) not found"
            exit 1
          fi

          # Remove files (excluding protected ones)
          echo "Removing unnecessary files..."
          find . -path "./.git" -prune -o -type f ! -name "package.json" ! -name "package-lock.json" ! -name "*.md" ! -path "./frontend/*" -print -exec rm -f {} +

          # Remove directories (excluding protected ones) 
          echo "Removing unnecessary directories..."
          find . -type d \( -path "./.git" -o -path "./frontend" \) -prune -o -type d ! -path "." -print -exec rm -rf {} +

          echo "Files and directories after cleanup:"
          find . -maxdepth 2 -type f -o -type d | head -20

      - uses: EndBug/add-and-commit@87b592fb195e007c0de5a650266d5a8f9d4e90b2
        with:
          message: "Release frontend nachet-frontend-v${{ steps.versions.outputs.app-version }}"
          add: "."
          author_name: "GitHub Action"
          author_email: actions@github.com

      - name: Tag the clean version on the release branch
        run: |
          tag_name="nachet-frontend-v${{ steps.versions.outputs.app-version }}"

          # Check if tag exists locally and delete it
          if git tag -l | grep -q "^$tag_name$"; then
            echo "Tag $tag_name exists locally, deleting it"
            git tag -d $tag_name
          fi

          # Check if tag exists remotely and delete it
          if git ls-remote --tags origin | grep -q "refs/tags/$tag_name$"; then
            echo "Tag $tag_name exists remotely, deleting it"
            git push --delete origin refs/tags/$tag_name
          fi

          # Create and push new tag
          git tag -a $tag_name -m "Frontend Release ${{ steps.versions.outputs.app-version }}"
          git push origin refs/tags/$tag_name

      - name: Generate changelog from PRs since last frontend tag
        id: generate_changelog
        run: |
          # Fetch the latest frontend tag as a reference
          latest_tag=$(git tag -l "nachet-frontend-v*" | sort -V | tail -n 1 2>/dev/null || echo "")

          if [ -z "$latest_tag" ]; then
            echo "No previous frontend tags found, generating changelog from beginning of history"
            latest_tag_date="\"1970-01-01T00:00:00Z\""
          else
            echo "Found latest frontend tag: $latest_tag"
            # Format date for jq comparison
            latest_tag_date=$(git log -1 --format=%ai "$latest_tag" | sed 's/.*/"&"/')
          fi

          frontend_changelog=""

          # Fetch merged PRs since the latest tag
          echo "Fetching merged PRs since $latest_tag_date"
          pr_list=$(gh pr list --repo $GITHUB_REPOSITORY --state merged --json number,title,url,mergedAt --jq ".[] | select(.mergedAt > $latest_tag_date) | .number" 2>/dev/null || echo "")

          if [ -z "$pr_list" ]; then
            echo "No merged PRs found since latest tag"
          else
            echo "Found PRs: $pr_list"
          fi

          for pr in $pr_list; do
            echo "Processing PR #$pr"
            files=$(gh pr view "$pr" --repo $GITHUB_REPOSITORY --json files --jq '.files[].path' 2>/dev/null || echo "")
            
            if [ -z "$files" ]; then
              echo "Warning: Could not fetch files for PR #$pr, skipping"
              continue
            fi

            if echo "$files" | grep -q "^frontend/"; then
              pr_info=$(gh pr view "$pr" --repo $GITHUB_REPOSITORY --json title,url | jq -r '"- \(.title) (\(.url))"')
              frontend_changelog="$frontend_changelog\n$pr_info"
            fi
          done

          changelog="## Frontend Changes\n"

          if [ -n "$frontend_changelog" ]; then
            changelog="$changelog$frontend_changelog"
          else
            changelog="$changelog\n- No frontend-specific changes found in recent PRs"
          fi

          # Print changelog for debugging
          echo "Generated changelog:"
          echo -e "$changelog"

          # Output changelog content to GitHub Actions output for use in release step
          echo "release_body<<EOF" >> $GITHUB_OUTPUT
          echo -e "$changelog" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@a0e7822741653f905804157a2fea14e40db10c8c
        with:
          tag: "nachet-frontend-v${{ steps.versions.outputs.app-version }}"
          name: "nachet-frontend v${{ steps.versions.outputs.app-version }}"
          body: "${{ steps.generate_changelog.outputs.release_body }}"
          allowUpdates: true
          generateReleaseNotes: false
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
