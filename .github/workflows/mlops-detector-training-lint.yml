---
name: Detector training lint

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "mlops/training/detector/**"
      - ".github/workflows/mlops-detector-training-lint.yml"
  push:
    branches:
      - main
    paths:
      - "mlops/training/detector/**"
      - ".github/workflows/mlops-detector-training-lint.yml"
  workflow_dispatch:

jobs:
  python-lint:
    uses: ai-cfia/github-workflows/.github/workflows/workflow-lint-python-mono.yml@main
    with:
      working-directory: mlops/training/detector
