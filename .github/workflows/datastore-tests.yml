name: datastore tests

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - 'datastore/**'
      - '.github/workflows/datastore-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'datastore/**'
      - '.github/workflows/datastore-tests.yml'

defaults:
  run:
    working-directory: datastore

jobs:
  test:
    runs-on: ubuntu-latest
    environment: datastore_ci
    timeout-minutes: 15
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: ${{ secrets.PG_PASS }}
          POSTGRES_DB: ${{ secrets.PG_DB }}
          POSTGRES_USER: ${{ secrets.PG_USER }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Install Azurite
        run: npm install -g azurite
      
      - name: Start Azurite Blob Storage Emulator
        shell: bash
        run: azurite --loose --blobHost 127.0.0.1 --blobPort 10000 &
      
      # - name: Wait for Azurite to be ready
      #   run: |
      #     timeout 30 bash -c 'until curl -f http://127.0.0.1:10000/ 2>/dev/null; do sleep 1; done'

      - name: Set up database schema
        run: |
          psql -h 127.0.0.1 -U ${{ secrets.PG_USER }} -d ${{ secrets.PG_DB }} -c "CREATE SCHEMA IF NOT EXISTS \"nachet_0.0.10\";"
          psql -h 127.0.0.1 -U ${{ secrets.PG_USER }} -d ${{ secrets.PG_DB }} -c "CREATE SCHEMA IF NOT EXISTS \"nachet_0.0.11\";"
          psql -h 127.0.0.1 -U ${{ secrets.PG_USER }} -d ${{ secrets.PG_DB }} -c "CREATE SCHEMA IF NOT EXISTS uuid_;"
          psql -h 127.0.0.1 -U ${{ secrets.PG_USER }} -d ${{ secrets.PG_DB }} -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\" SCHEMA uuid_;"
          psql -h 127.0.0.1 -U ${{ secrets.PG_USER }} -d ${{ secrets.PG_DB }} -f nachet/db/bytebase/schema_nachet_0.0.11.sql
        env:
          PGPASSWORD:  ${{ secrets.PG_PASS }}

      - name: Verify schema setup
        run: |
          psql -h 127.0.0.1 -U ${{ secrets.PG_USER }} -d ${{ secrets.PG_DB }} -c "\dt \"nachet_0.0.11\".*" -c "\df \"nachet_0.0.11\".*" -c "SELECT * FROM \"nachet_0.0.11\".seed;"
        env:
          PGPASSWORD: ${{ secrets.PG_PASS }}

      - name: Run tests
        run: |
          python -m pytest tests/nachet/db/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing
        env:
          TESTING: "true"
          NACHET_AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.NACHET_AZURE_STORAGE_CONNECTION_STRING }}
          NACHET_STORAGE_URL_TESTING: ${{ secrets.NACHET_AZURE_STORAGE_CONNECTION_STRING }}
          NACHET_STORAGE_URL: ${{ secrets.NACHET_AZURE_STORAGE_CONNECTION_STRING }}
          NACHET_DB_URL: ${{ secrets.NACHET_DB_URL }}
          NACHET_SCHEMA_TESTING: "nachet_0.0.11"
          NACHET_SCHEMA: "nachet_0.0.11"
          NACHET_DATA: "https://raw.githubusercontent.com/ai-cfia/nachet-data/main/"
          NACHET_MAX_CONTENT_LENGTH: "200"
          NACHET_BLOB_PIPELINE_NAME: sg-nachet-pipeline-dev
          NACHET_BLOB_PIPELINE_VERSION: 0.1.3
          NACHET_BLOB_PIPELINE_DECRYPTION_KEY: ${{ secrets.NACHET_BLOB_PIPELINE_DECRYPTION_KEY }}
          NACHET_BLOB_ACCOUNT: ${{ secrets.NACHET_BLOB_ACCOUNT }}
          NACHET_BLOB_ACCOUNT_TESTING: ${{ secrets.NACHET_BLOB_ACCOUNT }}
          NACHET_BLOB_KEY: ${{ secrets.NACHET_BLOB_KEY }}
          NACHET_BLOB_KEY_TESTING: ${{ secrets.NACHET_BLOB_KEY }}
          NACHET_VALID_EXTENSION: '["jpeg", "jpg", "png", "gif", "bmp", "tiff", "webp"]'
          NACHET_VALID_DIMENSION: '{"width": 1920, "height": 1080}'
          DEV_USER_EMAIL: "example@gmail.com"
          NACHET_ENV: "local" # local, dev, prod
          NACHET_FRONTEND_PUBLIC_URL: "https://nachet.inspection.alpha.canada.ca"
          NACHET_FRONTEND_DEV_URL: "http://localhost:5173"
          PORT: 5174

      # - name: Upload coverage to Codecov
      #   if: success()
      #   uses: codecov/codecov-action@v3
      #   with:
      #     file: ./datastore/coverage.xml
      #     flags: datastore
      #     name: datastore-coverage

  trigger-release:
    name: Trigger release workflow
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Trigger Release Workflow for Nachet Datastore
        run: |
          gh workflow run datastore-publish-package.yml \
          --ref main \
          -f package-name=nachet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
