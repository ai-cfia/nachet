name: datastore tests

permissions:
  contents: read
  pull-requests: write
  actions: write

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "backend/app/db/**"
      - ".github/workflows/datastore-*"
  push:
    branches:
      - main
    paths:
      - "backend/app/db/**"
      - ".github/workflows/datastore-*"

defaults:
  run:
    working-directory: backend/app/db

jobs:
  test:
    runs-on: ubuntu-latest
    environment: datastore_ci
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@142240426d0e82f3e584603c3aa194c582f5aed3

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite Blob Storage Emulator
        shell: bash
        run: azurite --loose --blobHost 127.0.0.1 --blobPort 10000 &

      # - name: Wait for Azurite to be ready
      #   run: |
      #     timeout 30 bash -c 'until curl -f http://127.0.0.1:10000/ 2>/dev/null; do sleep 1; done'

      - name: Alembic migration to repo head
        working-directory: backend/app/db
        run: |
          uv run db_setup_test.py
        env:
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: "${{ secrets.NACHET_SCHEMA }}"

      - name: Run tests
        run: |
          uv run pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing
        env:
          BACKEND_DEV_PORT: ${{ secrets.BACKEND_DEV_PORT }}
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: "${{ secrets.NACHET_SCHEMA }}"

      # - name: Upload coverage to Codecov
      #   if: success()
      #   uses: codecov/codecov-action@v3
      #   with:
      #     file: ./datastore/coverage.xml
      #     flags: datastore
      #     name: datastore-coverage

  trigger-release:
    name: Trigger release workflow
    # This job triggers the publish workflow automatically when a PR is merged to main
    # The publish workflow can also be triggered manually via workflow_dispatch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Release Workflow for Nachet Datastore
        run: |
          gh workflow run datastore-publish-package.yml \
          --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
