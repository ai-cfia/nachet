name: Schema Validation

permissions:
  contents: read
  pull-requests: write
  actions: write

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/app/db/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/app/db/**"

defaults:
  run:
    working-directory: backend/app/db

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    environment: backend-test-env
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@208b0c0ee42039b2cbf5fd3ca0ec7d6d8a49336f
        with:
          version: "latest"

      - name: Install backend dependencies
        run: |
          uv sync --dev
        working-directory: backend

      - name: Validate ORM classes (quick check)
        run: |
          uv run python validate_orm_offline.py
        env:
          TESTING: "true"

      - name: Validate ORM with runtime checks
        run: |
          uv run python validate_orm_online.py
        env:
          TESTING: "false"

      - name: Alembic migration to repo head
        working-directory: backend/app/db
        run: |
          uv run db_setup_test.py
        env:
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: ${{ secrets.NACHET_SCHEMA }}

      - name: Use Alembic Check
        working-directory: backend/app/db
        run: |
          echo "🔍 Running Alembic check if a new migration file is needed..."
          uv run validate_orm_alembic.py
        env:
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: ${{ secrets.NACHET_SCHEMA }}
