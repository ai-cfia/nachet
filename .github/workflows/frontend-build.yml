name: Frontend Build and Push

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
    types:
      - opened
      - closed
      - synchronize

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IS_MONOREPO: true
  FRONTEND_PATH: frontend
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nachet-frontend

defaults:
  run:
    working-directory: frontend

jobs:
  get-version:
    uses: ./.github/workflows/reusable-frontend-versions.yml
    with:
      working-directory: frontend
      package-name: nachet-frontend
      skip-version-check: false

  build-and-push-gcr:
    needs: get-version
    # uses: ./.github/workflows/workflow-build-push-container-github-registry-mono.yml
    uses: ai-cfia/github-workflows/.github/workflows/workflow-build-push-container-github-registry-mono.yml@main
    with:
      working-directory: frontend
      container-name: ${{ github.event.repository.name }}-frontend
      tag: ${{ github.sha }}
      release-version: ${{ needs.get-version.outputs.app-version }}
      registry: ghcr.io/ai-cfia
    secrets: inherit

  sign-images:
    needs: [get-version, build-and-push-gcr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@115e4ce455e573aa6e9ba51e8d040ddd5c1378af
        with:
          cosign-release: "v2.2.3"

      - name: Log in to the github container registry (GCR)
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign frontend images
        working-directory: .
        env:
          IMAGE: ghcr.io/ai-cfia/${{ github.event.repository.name }}-frontend
          RELEASE_VERSION: ${{ needs.get-version.outputs.app-version }}
        run: |
          set -euo pipefail

          tags=(
            "${IMAGE}:${{ github.sha }}"
            "${IMAGE}:${RELEASE_VERSION}"
          )

          if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            tags+=("${IMAGE}:${{ github.event.pull_request.base.ref }}")
          else
            branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            clean_branch_name="$(echo "$branch_name" | sed 's/[\/\\]/-/g')"
            tags+=(
              "${IMAGE}:${{ github.event.number }}"
              "${IMAGE}:${clean_branch_name}"
            )
          fi

          for tag in "${tags[@]}"; do
            echo "Signing frontend image: $tag"
            cosign sign --yes "$tag"
          done

          for tag in "${tags[@]}"; do
            echo "Verifying frontend image signature: $tag"
            cosign verify \
              --certificate-identity-regexp='^https://github.com/ai-cfia/.*$' \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              "$tag"
          done
