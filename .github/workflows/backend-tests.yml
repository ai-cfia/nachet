---
name: backend tests

permissions:
  contents: read
  pull-requests: write
  actions: write

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "backend/**"
      - ".github/workflows/backend-*"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-*"

defaults:
  run:
    working-directory: backend

jobs:
  security-headers-tests:
    runs-on: ubuntu-latest
    environment: backend-test-env
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c7d85d99881d7a73ab083c7797320c372f437754

      - name: Install dependencies
        run: |
          uv sync --dev
        working-directory: backend

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite Blob Storage Emulator
        shell: bash
        run: azurite --loose --blobHost 127.0.0.1 --blobPort 10000 &

      - name: Alembic migration to repo head
        working-directory: backend/app/db
        run: |
          uv run db_setup_test.py
        env:
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: "${{ secrets.NACHET_SCHEMA }}"

      - name: Start backend server
        working-directory: backend
        run: |
          echo "Starting hypercorn with logging..."
          nohup uv run hypercorn -b :5174 app/main:app --access-logfile - --error-logfile - --log-level debug > hypercorn.log 2>&1 &
          sleep 5
          # Wait for server to start
          timeout 30 bash -c 'until curl -f http://localhost:5174/health 2>/dev/null; do echo "Waiting for health endpoint..."; sleep 2; done'
        env:
          # NACHET_AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.NACHET_AZURE_STORAGE_CONNECTION_STRING }}
          # NACHET_STORAGE_URL_TESTING: ${{ secrets.NACHET_AZURE_STORAGE_CONNECTION_STRING }}
          # NACHET_STORAGE_URL: ${{ secrets.NACHET_AZURE_STORAGE_CONNECTION_STRING }}
          # NACHET_DB_URL: "postgresql://${{ secrets.PG_USER }}:${{ secrets.PG_PASS }}@127.0.0.1:5432/${{ secrets.PG_DB }}"
          # NACHET_DATA: "https://raw.githubusercontent.com/ai-cfia/nachet-data/main/"
          # NACHET_MAX_CONTENT_LENGTH: "200"
          # NACHET_BLOB_PIPELINE_NAME: sg-nachet-pipeline-dev
          # NACHET_BLOB_PIPELINE_VERSION: 0.1.3
          # NACHET_BLOB_PIPELINE_DECRYPTION_KEY: ${{ secrets.NACHET_BLOB_PIPELINE_DECRYPTION_KEY }}
          # NACHET_BLOB_ACCOUNT: ${{ secrets.NACHET_BLOB_ACCOUNT }}
          # NACHET_BLOB_ACCOUNT_TESTING: ${{ secrets.NACHET_BLOB_ACCOUNT }}
          # NACHET_BLOB_KEY: ${{ secrets.NACHET_BLOB_KEY }}
          # NACHET_BLOB_KEY_TESTING: ${{ secrets.NACHET_BLOB_KEY }}
          # NACHET_VALID_EXTENSION: '["jpeg", "jpg", "png", "gif", "bmp", "tiff", "webp"]'
          # NACHET_VALID_DIMENSION: '{"width": 1920, "height": 1080}'
          # DEV_USER_EMAIL: ${{ secrets.DEV_USER_EMAIL }}
          # NACHET_ENV: "local"
          # NACHET_FRONTEND_PUBLIC_URL: "https://nachet.inspection.alpha.canada.ca"
          # NACHET_FRONTEND_DEV_URL: "http://localhost:5173"
          BACKEND_DEV_PORT: ${{ secrets.BACKEND_DEV_PORT }}
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: "${{ secrets.NACHET_SCHEMA }}"
          BLOB_STORAGE_PROVIDER: ${{ secrets.BLOB_STORAGE_PROVIDER }}
          BLOB_STORAGE_NAME: ${{ secrets.BLOB_STORAGE_NAME }}
          BLOB_STORAGE_KEY: ${{ secrets.BLOB_STORAGE_KEY }}
          BLOB_STORAGE_ENDPOINT_PROTOCOL: ${{ secrets.BLOB_STORAGE_ENDPOINT_PROTOCOL }}
          BLOB_STORAGE_ENDPOINT_SUFFIX: ${{ secrets.BLOB_STORAGE_ENDPOINT_SUFFIX }}
          BLOB_STORAGE_ENDPOINT_BASE: ${{ secrets.BLOB_STORAGE_ENDPOINT_BASE }}

      - name: Checkout OSHP validator
        uses: actions/checkout@v5
        with:
          repository: oshp/oshp-validator
          path: oshp-validator

      - name: Run OSHP validator security headers test
        run: |
          # Create output directory and run tests
          mkdir -p ${{ github.workspace }}/test-results
          set +e
          docker run --rm --network="host" \
            -v ${{ github.workspace }}/oshp-validator:/workspace \
            -v ${{ github.workspace }}/test-results:/test-results \
            ovhcom/venom:latest run \
            --var="target_site=http://127.0.0.1:5174/health" \
            --output-dir=/test-results \
            --format=xml \
            /workspace/tests_suite.yml
          VENOM_EXIT_CODE=$?
          set -e

          # Fix file permissions created by Docker
          sudo chmod -R 755 ${{ github.workspace }}/test-results/
          ls -la ${{ github.workspace }}/test-results/

          # Define expected failures (tests we know will fail)
          export EXPECTED_FAILURES="Clear-Site-Data Cache-Control Permissions-Policy"

          # Parse results and check for unexpected failures
          python3 - <<EOF
          import xml.etree.ElementTree as ET
          import sys
          import os

          expected_failures = os.environ.get('EXPECTED_FAILURES', '').split()

          try:
              # Find the XML file
              import glob
              xml_files = glob.glob('${{ github.workspace }}/test-results/test_results*.xml')
              if not xml_files:
                  print("No XML results file found")
                  print("Available files:")
                  import os
                  for f in os.listdir('${{ github.workspace }}/test-results/'):
                      print(f"  {f}")
                  sys.exit(1)
              
              tree = ET.parse(xml_files[0])
              root = tree.getroot()
              
              print(f"XML file: {xml_files[0]}")
              print(f"Root element: {root.tag}")
              
              unexpected_failures = []
              expected_but_passed = []
              all_tests = []
              
              for testcase in root.findall('.//testcase'):
                  test_name = testcase.get('name', '')
                  # Check both 'failure' and 'error' elements, and check if test passed
                  is_failure = (testcase.find('failure') is not None or 
                               testcase.find('error') is not None or
                               testcase.get('status') == 'FAIL')
                  
                  # Also check if the test suite itself shows failures
                  if not is_failure:
                      # Look for any failure indicators in the test
                      failure_text = testcase.text or ''
                      if 'FAIL' in failure_text or 'failed' in failure_text.lower():
                          is_failure = True
                  
                  all_tests.append(f"{test_name} ({'FAIL' if is_failure else 'PASS'})")
                  print(f"Debug - {test_name}: failure_elem={testcase.find('failure') is not None}, error_elem={testcase.find('error') is not None}, status={testcase.get('status')}")
                  
                  if is_failure and test_name not in expected_failures:
                      unexpected_failures.append(test_name)
                  elif not is_failure and test_name in expected_failures:
                      expected_but_passed.append(test_name)
              
              print(f"All tests found: {all_tests}")
              
              print(f"Expected failures: {expected_failures}")
              print(f"Unexpected failures: {unexpected_failures}")
              print(f"Expected failures that passed: {expected_but_passed}")
              
              if unexpected_failures:
                  print(f"❌ FAILURE: Unexpected test failures: {unexpected_failures}")
                  sys.exit(1)
              else:
                  print("✅ SUCCESS: Only expected failures occurred")
                  sys.exit(0)
                  
          except Exception as e:
              print(f"Error parsing results: {e}")
              sys.exit(1)
          EOF
        env:
          EXPECTED_FAILURES: "Clear-Site-Data Cache-Control Permissions-Policy"

      - name: Show server logs (for debugging)
        if: always()
        working-directory: backend
        run: |
          echo "=== Hypercorn startup logs ==="
          cat hypercorn.log || echo "No log file found"
          echo "=== Process status ==="
          ps aux | grep hypercorn || echo "No hypercorn process found"
          echo "=== Port status ==="
          netstat -tlnp | grep :5174 || echo "Port 5174 not listening"

  business-logic-tests:
    runs-on: ubuntu-latest
    environment: backend-test-env
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c7d85d99881d7a73ab083c7797320c372f437754

      - name: Install dependencies
        run: |
          uv sync --dev
          uv add toml pytest-cov

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite Blob Storage Emulator
        shell: bash
        run: azurite --loose --blobHost 127.0.0.1 --blobPort 10000 &

      # - name: Wait for Azurite to be ready
      #   run: |
      #     timeout 30 bash -c 'until curl -f http://127.0.0.1:10000/ 2>/dev/null; do sleep 1; done'

      - name: Alembic migration to repo head
        working-directory: backend/app/db
        run: |
          uv run db_setup_test.py
        env:
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: "${{ secrets.NACHET_SCHEMA }}"

      - name: Run tests
        run: |
          uv run pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing
        env:
          # NACHET_AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.NACHET_AZURE_STORAGE_CONNECTION_STRING }}
          # NACHET_STORAGE_URL_TESTING: ${{ secrets.NACHET_AZURE_STORAGE_CONNECTION_STRING }}
          # NACHET_STORAGE_URL: ${{ secrets.NACHET_AZURE_STORAGE_CONNECTION_STRING }}
          # NACHET_DB_URL: "postgresql://${{ secrets.PG_USER }}:${{ secrets.PG_PASS }}@127.0.0.1:5432/${{ secrets.PG_DB }}"
          # NACHET_DATA: "https://raw.githubusercontent.com/ai-cfia/nachet-data/main/"
          # NACHET_MAX_CONTENT_LENGTH: "200"
          # NACHET_BLOB_PIPELINE_NAME: sg-nachet-pipeline-dev
          # NACHET_BLOB_PIPELINE_VERSION: 0.1.3
          # NACHET_BLOB_PIPELINE_DECRYPTION_KEY: ${{ secrets.NACHET_BLOB_PIPELINE_DECRYPTION_KEY }}
          # NACHET_BLOB_ACCOUNT: ${{ secrets.NACHET_BLOB_ACCOUNT }}
          # NACHET_BLOB_ACCOUNT_TESTING: ${{ secrets.NACHET_BLOB_ACCOUNT }}
          # NACHET_BLOB_KEY: ${{ secrets.NACHET_BLOB_KEY }}
          # NACHET_BLOB_KEY_TESTING: ${{ secrets.NACHET_BLOB_KEY }}
          # NACHET_VALID_EXTENSION: '["jpeg", "jpg", "png", "gif", "bmp", "tiff", "webp"]'
          # NACHET_VALID_DIMENSION: '{"width": 1920, "height": 1080}'
          # DEV_USER_EMAIL: ${{ secrets.DEV_USER_EMAIL }}
          # NACHET_ENV: "local"
          # NACHET_FRONTEND_PUBLIC_URL: "https://nachet.inspection.alpha.canada.ca"
          # NACHET_FRONTEND_DEV_URL: "http://localhost:5173"
          BACKEND_DEV_PORT: ${{ secrets.BACKEND_DEV_PORT }}
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: "${{ secrets.NACHET_SCHEMA }}"

      # - name: Upload coverage to Codecov
      #   if: success()
      #   uses: codecov/codecov-action@v3
      #   with:
      #     file: ./backend/coverage.xml
      #     flags: backend
      #     name: backend-coverage

  trigger-release:
    name: Trigger release workflow
    # This job triggers the publish workflow automatically when a PR is merged to main
    # The publish workflow can also be triggered manually via workflow_dispatch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Trigger Release Workflow for Nachet backend
        run: |
          gh workflow run backend-release.yml \
          --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
