---
name: backend tests

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "backend/**"
      - ".github/workflows/backend-*"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-*"

defaults:
  run:
    working-directory: backend

jobs:
  security-headers-tests:
    runs-on: ubuntu-latest
    environment: backend-test-env
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@2841f9f5c1f3a4d2fe660cb20a8910794bac0423

      - name: Install dependencies
        run: |
          uv sync --dev
        working-directory: backend

      - name: Start Garage S3 storage
        run: |
          # Create temporary directories for Garage
          mkdir -p /tmp/garage-meta /tmp/garage-data

          # Create Garage configuration file
          cat > /tmp/garage.toml <<EOF
          metadata_dir = "/tmp/meta"
          data_dir = "/tmp/data"
          db_engine = "sqlite"
          replication_factor = 1
          rpc_bind_addr = "[::]:12441"
          rpc_public_addr = "127.0.0.1:12441"
          rpc_secret = "1799bccfd7411eddcf9ebd316bc1f5287ad12a68094e1c6ac6abde7e6feae1ec"

          [s3_api]
          s3_region = "garage"
          api_bind_addr = "[::]:12440"
          root_domain = ".s3.garage.localhost"

          [admin]
          api_bind_addr = "[::]:12443"
          admin_token = "ae8cb8e63d9afaf30c2b6b43f8d1c1073e9308d9194e04036bf2f94bbc4bfe89"
          metrics_token = "1a4c97d447ac7fa10a456e93212e4a9ee90524144d70bcd93d15c0b9fb6bb089"
          EOF

          # Start Garage container
          docker run -d \
            --name garage \
            --network ${{ job.container.network }} \
            -e RUST_LOG=garage=debug \
            -p 12440:12440 \
            -p 12441:12441 \
            -p 12443:12443 \
            -v /tmp/garage.toml:/etc/garage.toml \
            -v /tmp/garage-meta:/tmp/meta \
            -v /tmp/garage-data:/tmp/data \
            dxflrs/garage:v2.1.0

      - name: Wait for Garage to be ready
        run: |
          timeout 30 bash -c 'until docker exec garage /garage status 2>/dev/null | grep -q "HEALTHY"; do sleep 2; done'

      - name: Initialize Garage cluster
        id: garage_init
        run: |
          # Get node ID
          NODE_ID=$(docker exec garage /garage status | grep "NO ROLE ASSIGNED" | awk '{print $1}')
          echo "Node ID: $NODE_ID"

          # Assign zone and capacity
          docker exec garage /garage layout assign -z dc1 -c 1G $NODE_ID

          # Apply layout
          docker exec garage /garage layout apply --version 1

          # Create access key
          KEY_OUTPUT=$(docker exec garage /garage key create nachet-ci-test-key)
          echo "$KEY_OUTPUT"

          # Extract credentials
          ACCESS_KEY=$(echo "$KEY_OUTPUT" | grep "Key ID:" | awk '{print $3}')
          SECRET_KEY=$(echo "$KEY_OUTPUT" | grep "Secret key:" | awk '{print $3}')

          echo "ACCESS_KEY=$ACCESS_KEY" >> $GITHUB_OUTPUT
          echo "SECRET_KEY=$SECRET_KEY" >> $GITHUB_OUTPUT

          # Allow create-bucket permission
          docker exec garage /garage key allow --create-bucket nachet-ci-test-key

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite Blob Storage Emulator
        shell: bash
        run: azurite --loose --blobHost 127.0.0.1 --blobPort 10000 &

      - name: Alembic migration to repo head
        working-directory: backend/app/db
        run: |
          uv run db_setup_test.py
        env:
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: "${{ secrets.NACHET_SCHEMA }}"
          CFIA_ORGANIZATION_ID: ${{ secrets.CFIA_ORGANIZATION_ID }}
          CFIA_ADMIN_ROLE_ID: ${{ secrets.CFIA_ADMIN_ROLE_ID }}
          CFIA_USER_ROLE_ID: ${{ secrets.CFIA_USER_ROLE_ID }}

      - name: Start backend server
        working-directory: backend
        run: |
          echo "Starting hypercorn with logging..."
          nohup uv run hypercorn -b :5174 app/main:app --access-logfile - --error-logfile - --log-level debug > hypercorn.log 2>&1 &
          sleep 5
          # Wait for server to start
          timeout 30 bash -c 'until curl -f http://localhost:5174/health 2>/dev/null; do echo "Waiting for health endpoint..."; sleep 2; done'
        env:
          BACKEND_DEV_PORT: ${{ secrets.BACKEND_DEV_PORT }}
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: "${{ secrets.NACHET_SCHEMA }}"
          BLOB_STORAGE_PROVIDER: ${{ secrets.BLOB_STORAGE_PROVIDER }}
          BLOB_STORAGE_NAME: ${{ secrets.BLOB_STORAGE_NAME }}
          BLOB_STORAGE_KEY: ${{ secrets.BLOB_STORAGE_KEY }}
          BLOB_STORAGE_ENDPOINT_PROTOCOL: ${{ secrets.BLOB_STORAGE_ENDPOINT_PROTOCOL }}
          BLOB_STORAGE_ENDPOINT_SUFFIX: ${{ secrets.BLOB_STORAGE_ENDPOINT_SUFFIX }}
          BLOB_STORAGE_ENDPOINT_BASE: ${{ secrets.BLOB_STORAGE_ENDPOINT_BASE }}
          CORS_ALLOW_ORIGINS: "http://localhost:5174,http://127.0.0.1:5174"
          TRUSTED_HOSTS: "localhost,127.0.0.1"
          CFIA_ORGANIZATION_ID: ${{ secrets.CFIA_ORGANIZATION_ID }}
          CFIA_ADMIN_ROLE_ID: ${{ secrets.CFIA_ADMIN_ROLE_ID }}
          CFIA_USER_ROLE_ID: ${{ secrets.CFIA_USER_ROLE_ID }}
          BLOB_STORAGE_EXTERNAL_NAME: ${{ secrets.BLOB_STORAGE_NAME }}
          BLOB_STORAGE_EXTERNAL_KEY: ${{ secrets.BLOB_STORAGE_KEY }}
          BLOB_STORAGE_EXTERNAL_ENDPOINT_PROTOCOL: ${{ secrets.BLOB_STORAGE_ENDPOINT_PROTOCOL }}
          BLOB_STORAGE_EXTERNAL_ENDPOINT_SUFFIX: ${{ secrets.BLOB_STORAGE_ENDPOINT_SUFFIX }}
          BLOB_STORAGE_EXTERNAL_ENDPOINT_BASE: ${{ secrets.BLOB_STORAGE_ENDPOINT_BASE }}
          BLOB_CONTAINER_PREFIX: "nachet-ci-test-"
          S3_ACCESS_KEY: ${{ steps.garage_init.outputs.ACCESS_KEY }}
          S3_SECRET_KEY: ${{ steps.garage_init.outputs.SECRET_KEY }}
          S3_REGION_NAME: "garage"
          S3_USE_SSL: "false"
          S3_VERIFY: "false"
          S3_ENDPOINT_URL: "http://127.0.0.1:12440"

      - name: Checkout OSHP validator
        uses: actions/checkout@v6
        with:
          repository: oshp/oshp-validator
          path: oshp-validator

      - name: Run OSHP validator security headers test
        run: |
          # Create output directory and run tests
          mkdir -p ${{ github.workspace }}/test-results
          set +e
          docker run --rm --network="host" \
            -v ${{ github.workspace }}/oshp-validator:/workspace \
            -v ${{ github.workspace }}/test-results:/test-results \
            ovhcom/venom:latest run \
            --var="target_site=http://127.0.0.1:5174/health" \
            --output-dir=/test-results \
            --format=xml \
            /workspace/tests_suite.yml
          VENOM_EXIT_CODE=$?
          set -e

          # Fix file permissions created by Docker
          sudo chmod -R 755 ${{ github.workspace }}/test-results/
          ls -la ${{ github.workspace }}/test-results/

          # Define expected failures (tests we know will fail)
          export EXPECTED_FAILURES="Clear-Site-Data Permissions-Policy X-Frame-Options Cross-Origin-Embedder-Policy"

          # Clear-Site-Data is not set because we store non-sensitive cached data such as user preferences
          # Permissions-Policy we need camera access, and copy paste for users
          # X-Frame-Options is not set since CSP frame-ancestors is used instead
          # Cross-Origin-Embedder-Policy is set to credentialless because we do not control microsoft login and they do not have CORP cross-origin set

          # Parse results and check for unexpected failures
          python3 - <<EOF
          import xml.etree.ElementTree as ET
          import sys
          import os

          expected_failures = os.environ.get('EXPECTED_FAILURES', '').split()

          try:
              # Find the XML file
              import glob
              xml_files = glob.glob('${{ github.workspace }}/test-results/test_results*.xml')
              if not xml_files:
                  print("No XML results file found")
                  print("Available files:")
                  import os
                  for f in os.listdir('${{ github.workspace }}/test-results/'):
                      print(f"  {f}")
                  sys.exit(1)
              
              tree = ET.parse(xml_files[0])
              root = tree.getroot()
              
              print(f"XML file: {xml_files[0]}")
              print(f"Root element: {root.tag}")
              
              unexpected_failures = []
              expected_but_passed = []
              all_tests = []
              
              for testcase in root.findall('.//testcase'):
                  test_name = testcase.get('name', '')
                  # Check both 'failure' and 'error' elements, and check if test passed
                  is_failure = (testcase.find('failure') is not None or 
                               testcase.find('error') is not None or
                               testcase.get('status') == 'FAIL')
                  
                  # Also check if the test suite itself shows failures
                  if not is_failure:
                      # Look for any failure indicators in the test
                      failure_text = testcase.text or ''
                      if 'FAIL' in failure_text or 'failed' in failure_text.lower():
                          is_failure = True
                  
                  all_tests.append(f"{test_name} ({'FAIL' if is_failure else 'PASS'})")
                  print(f"Debug - {test_name}: failure_elem={testcase.find('failure') is not None}, error_elem={testcase.find('error') is not None}, status={testcase.get('status')}")
                  
                  if is_failure and test_name not in expected_failures:
                      unexpected_failures.append(test_name)
                  elif not is_failure and test_name in expected_failures:
                      expected_but_passed.append(test_name)
              
              print(f"All tests found: {all_tests}")
              
              print(f"Expected failures: {expected_failures}")
              print(f"Unexpected failures: {unexpected_failures}")
              print(f"Expected failures that passed: {expected_but_passed}")
              
              if unexpected_failures:
                  print(f"❌ FAILURE: Unexpected test failures: {unexpected_failures}")
                  sys.exit(1)
              else:
                  print("✅ SUCCESS: Only expected failures occurred")
                  sys.exit(0)
                  
          except Exception as e:
              print(f"Error parsing results: {e}")
              sys.exit(1)
          EOF
        env:
          EXPECTED_FAILURES: "Clear-Site-Data Cache-Control Permissions-Policy"

      - name: Show server logs (for debugging)
        if: always()
        working-directory: backend
        run: |
          echo "=== Hypercorn startup logs ==="
          cat hypercorn.log || echo "No log file found"
          echo "=== Process status ==="
          ps aux | grep hypercorn || echo "No hypercorn process found"
          echo "=== Port status ==="
          netstat -tlnp | grep :5174 || echo "Port 5174 not listening"

  business-logic-tests:
    runs-on: ubuntu-latest
    environment: backend-test-env
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Workspace chown
        working-directory: ${{ github.workspace }}
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true
            sudo chmod -R u+w $GITHUB_WORKSPACE || true
          fi

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Start WireMock containers
        working-directory: ${{ github.workspace }}
        run: |
          # Start WireMock containers with volume mounts
          docker run -d --name nachet-15spp-classifier -p 5001:8080 \
            -v $(pwd)/e2e/mocks/nachet-15spp-classifier:/home/wiremock/mappings \
            wiremock/wiremock:3.13.1

          docker run -d --name nachet-27spp-classifier -p 5002:8080 \
            -v $(pwd)/e2e/mocks/nachet-27spp-classifier:/home/wiremock/mappings \
            wiremock/wiremock:3.13.1

          docker run -d --name nachet-detector -p 5003:8080 \
            -v $(pwd)/e2e/mocks/nachet-detector:/home/wiremock/mappings \
            wiremock/wiremock:3.13.1

          # Wait for WireMock to be ready
          echo "Waiting for WireMock services to start..."
          sleep 5

          # Verify WireMock is responding
          curl -s http://127.0.0.1:5001/__admin/mappings > /dev/null && echo "✓ nachet-15spp-classifier is ready" || echo "✗ nachet-15spp-classifier failed"
          curl -s http://127.0.0.1:5002/__admin/mappings > /dev/null && echo "✓ nachet-27spp-classifier is ready" || echo "✗ nachet-27spp-classifier failed"
          curl -s http://127.0.0.1:5003/__admin/mappings > /dev/null && echo "✓ nachet-detector is ready" || echo "✗ nachet-detector failed"

          # Display mapping counts
          echo "Loaded mappings:"
          echo "  15spp classifier: $(curl -s http://127.0.0.1:5001/__admin/mappings | jq '.mappings | length')"
          echo "  27spp classifier: $(curl -s http://127.0.0.1:5002/__admin/mappings | jq '.mappings | length')"
          echo "  detector: $(curl -s http://127.0.0.1:5003/__admin/mappings | jq '.mappings | length')"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@2841f9f5c1f3a4d2fe660cb20a8910794bac0423

      - name: Install dependencies
        run: |
          uv sync --dev
          uv add toml pytest-cov

      - name: Start Garage S3 storage
        run: |
          # Create temporary directories for Garage
          mkdir -p /tmp/garage-meta /tmp/garage-data

          # Create Garage configuration file
          cat > /tmp/garage.toml <<EOF
          metadata_dir = "/tmp/meta"
          data_dir = "/tmp/data"
          db_engine = "sqlite"
          replication_factor = 1
          rpc_bind_addr = "[::]:12441"
          rpc_public_addr = "127.0.0.1:12441"
          rpc_secret = "1799bccfd7411eddcf9ebd316bc1f5287ad12a68094e1c6ac6abde7e6feae1ec"

          [s3_api]
          s3_region = "garage"
          api_bind_addr = "[::]:12440"
          root_domain = ".s3.garage.localhost"

          [admin]
          api_bind_addr = "[::]:12443"
          admin_token = "ae8cb8e63d9afaf30c2b6b43f8d1c1073e9308d9194e04036bf2f94bbc4bfe89"
          metrics_token = "1a4c97d447ac7fa10a456e93212e4a9ee90524144d70bcd93d15c0b9fb6bb089"
          EOF

          # Start Garage container
          docker run -d \
            --name garage \
            --network ${{ job.container.network }} \
            -e RUST_LOG=garage=debug \
            -p 12440:12440 \
            -p 12441:12441 \
            -p 12443:12443 \
            -v /tmp/garage.toml:/etc/garage.toml \
            -v /tmp/garage-meta:/tmp/meta \
            -v /tmp/garage-data:/tmp/data \
            dxflrs/garage:v2.1.0

      - name: Wait for Garage to be ready
        run: |
          timeout 30 bash -c 'until docker exec garage /garage status 2>/dev/null | grep -q "HEALTHY"; do sleep 2; done'

      - name: Initialize Garage cluster
        id: garage_init
        run: |
          # Get node ID
          NODE_ID=$(docker exec garage /garage status | grep "NO ROLE ASSIGNED" | awk '{print $1}')
          echo "Node ID: $NODE_ID"

          # Assign zone and capacity
          docker exec garage /garage layout assign -z dc1 -c 1G $NODE_ID

          # Apply layout
          docker exec garage /garage layout apply --version 1

          # Create access key
          KEY_OUTPUT=$(docker exec garage /garage key create nachet-ci-test-key)
          echo "$KEY_OUTPUT"

          # Extract credentials
          ACCESS_KEY=$(echo "$KEY_OUTPUT" | grep "Key ID:" | awk '{print $3}')
          SECRET_KEY=$(echo "$KEY_OUTPUT" | grep "Secret key:" | awk '{print $3}')

          echo "ACCESS_KEY=$ACCESS_KEY" >> $GITHUB_OUTPUT
          echo "SECRET_KEY=$SECRET_KEY" >> $GITHUB_OUTPUT

          # Allow create-bucket permission
          docker exec garage /garage key allow --create-bucket nachet-ci-test-key

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite Blob Storage Emulator
        shell: bash
        run: azurite --loose --blobHost 127.0.0.1 --blobPort 10000 &

      # - name: Wait for Azurite to be ready
      #   run: |
      #     timeout 30 bash -c 'until curl -f http://127.0.0.1:10000/ 2>/dev/null; do sleep 1; done'

      - name: Alembic migration to repo head
        working-directory: backend/app/db
        run: |
          uv run db_setup_test.py
        env:
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: "${{ secrets.NACHET_SCHEMA }}"
          CFIA_ORGANIZATION_ID: ${{ secrets.CFIA_ORGANIZATION_ID }}
          CFIA_ADMIN_ROLE_ID: ${{ secrets.CFIA_ADMIN_ROLE_ID }}

      - name: Run unit tests
        run: |
          uv run pytest tests/ --tb=short --cov=. --cov-report=xml --cov-report=term-missing  -m "not integration"
        env:
          BACKEND_DEV_PORT: ${{ secrets.BACKEND_DEV_PORT }}
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: "${{ secrets.NACHET_SCHEMA }}"
          BLOB_STORAGE_PROVIDER: ${{ secrets.BLOB_STORAGE_PROVIDER }}
          BLOB_STORAGE_NAME: ${{ secrets.BLOB_STORAGE_NAME }}
          BLOB_STORAGE_KEY: ${{ secrets.BLOB_STORAGE_KEY }}
          BLOB_STORAGE_ENDPOINT_PROTOCOL: ${{ secrets.BLOB_STORAGE_ENDPOINT_PROTOCOL }}
          BLOB_STORAGE_ENDPOINT_SUFFIX: ${{ secrets.BLOB_STORAGE_ENDPOINT_SUFFIX }}
          BLOB_STORAGE_ENDPOINT_BASE: ${{ secrets.BLOB_STORAGE_ENDPOINT_BASE }}
          CORS_ALLOW_ORIGINS: "http://localhost:5174,http://127.0.0.1:5174"
          CFIA_ORGANIZATION_ID: ${{ secrets.CFIA_ORGANIZATION_ID }}
          CFIA_ADMIN_ROLE_ID: ${{ secrets.CFIA_ADMIN_ROLE_ID }}
          CFIA_USER_ROLE_ID: ${{ secrets.CFIA_USER_ROLE_ID }}
          BLOB_STORAGE_EXTERNAL_NAME: ${{ secrets.BLOB_STORAGE_NAME }}
          BLOB_STORAGE_EXTERNAL_KEY: ${{ secrets.BLOB_STORAGE_KEY }}
          BLOB_STORAGE_EXTERNAL_ENDPOINT_PROTOCOL: ${{ secrets.BLOB_STORAGE_ENDPOINT_PROTOCOL }}
          BLOB_STORAGE_EXTERNAL_ENDPOINT_SUFFIX: ${{ secrets.BLOB_STORAGE_ENDPOINT_SUFFIX }}
          BLOB_STORAGE_EXTERNAL_ENDPOINT_BASE: ${{ secrets.BLOB_STORAGE_ENDPOINT_BASE }}
          BLOB_CONTAINER_PREFIX: "nachet-ci-test-"
          S3_ACCESS_KEY: ${{ steps.garage_init.outputs.ACCESS_KEY }}
          S3_SECRET_KEY: ${{ steps.garage_init.outputs.SECRET_KEY }}
          S3_REGION_NAME: "garage"
          S3_USE_SSL: "false"
          S3_VERIFY: "false"
          S3_ENDPOINT_URL: "http://127.0.0.1:12440"
          NACHET_ENV: "ci"

      - name: Run integration tests
        run: |
          uv run pytest tests/ --tb=short --cov=. --cov-report=xml --cov-report=term-missing  -m "integration"
        # run: |
        #   uv run pytest tests/ -vv -s -x --tb=long --cov=. --cov-report=xml --cov-report=term-missing  -m "integration"
        env:
          BACKEND_DEV_PORT: ${{ secrets.BACKEND_DEV_PORT }}
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: "${{ secrets.NACHET_SCHEMA }}"
          BLOB_STORAGE_PROVIDER: ${{ secrets.BLOB_STORAGE_PROVIDER }}
          BLOB_STORAGE_NAME: ${{ secrets.BLOB_STORAGE_NAME }}
          BLOB_STORAGE_KEY: ${{ secrets.BLOB_STORAGE_KEY }}
          BLOB_STORAGE_ENDPOINT_PROTOCOL: ${{ secrets.BLOB_STORAGE_ENDPOINT_PROTOCOL }}
          BLOB_STORAGE_ENDPOINT_SUFFIX: ${{ secrets.BLOB_STORAGE_ENDPOINT_SUFFIX }}
          BLOB_STORAGE_ENDPOINT_BASE: ${{ secrets.BLOB_STORAGE_ENDPOINT_BASE }}
          CORS_ALLOW_ORIGINS: "http://localhost:5174,http://127.0.0.1:5174"
          CFIA_ORGANIZATION_ID: ${{ secrets.CFIA_ORGANIZATION_ID }}
          CFIA_ADMIN_ROLE_ID: ${{ secrets.CFIA_ADMIN_ROLE_ID }}
          CFIA_USER_ROLE_ID: ${{ secrets.CFIA_USER_ROLE_ID }}
          BLOB_STORAGE_EXTERNAL_NAME: ${{ secrets.BLOB_STORAGE_NAME }}
          BLOB_STORAGE_EXTERNAL_KEY: ${{ secrets.BLOB_STORAGE_KEY }}
          BLOB_STORAGE_EXTERNAL_ENDPOINT_PROTOCOL: ${{ secrets.BLOB_STORAGE_ENDPOINT_PROTOCOL }}
          BLOB_STORAGE_EXTERNAL_ENDPOINT_SUFFIX: ${{ secrets.BLOB_STORAGE_ENDPOINT_SUFFIX }}
          BLOB_STORAGE_EXTERNAL_ENDPOINT_BASE: ${{ secrets.BLOB_STORAGE_ENDPOINT_BASE }}
          BLOB_CONTAINER_PREFIX: "nachet-ci-test-"
          S3_ACCESS_KEY: ${{ steps.garage_init.outputs.ACCESS_KEY }}
          S3_SECRET_KEY: ${{ steps.garage_init.outputs.SECRET_KEY }}
          S3_REGION_NAME: "garage"
          S3_USE_SSL: "false"
          S3_VERIFY: "false"
          S3_ENDPOINT_URL: "http://127.0.0.1:12440"
          NACHET_ENV: "ci"

      # - name: Upload coverage to Codecov
      #   if: success()
      #   uses: codecov/codecov-action@v3
      #   with:
      #     file: ./backend/coverage.xml
      #     flags: backend
      #     name: backend-coverage

  trigger-release:
    name: Trigger release workflow
    # This job triggers the publish workflow automatically when a PR is merged to main
    # The publish workflow can also be triggered manually via workflow_dispatch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Trigger Release Workflow for Nachet backend
        run: |
          gh workflow run backend-release.yml \
          --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
