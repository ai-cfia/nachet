---
name: MLOps export build and publish

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "mlops/export/**"
      - ".github/workflows/mlops-export.yml"
      - ".github/workflows/reusable-sign-container-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.merged &&
    github.event.pull_request.base.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.pull_request.merged != true }}

jobs:
  export-python-lint:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ai-cfia/github-workflows/.github/workflows/workflow-lint-python-mono.yml@c504dacdff61c8a1f7c796934e9ad20749f6d136
    with:
      working-directory: mlops/export

  export-tests:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: mlops/export
          target: test
          platforms: linux/amd64
          load: true
          tags: nachet-export:test
          cache-from: type=gha,scope=nachet-export
          cache-to: type=gha,scope=nachet-export,mode=max

      - name: Run offline export tests
        run: >-
          docker run --rm --network none --read-only
          --cap-drop ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,exec,size=2g
          nachet-export:test

      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: mlops/export
          target: final
          platforms: linux/amd64
          load: true
          tags: nachet-export:local
          cache-from: type=gha,scope=nachet-export

      - name: Check runtime CLIs
        run: |
          docker run --rm --network none --read-only nachet-export:local --help
          docker run --rm --network none --read-only --entrypoint python \
            nachet-export:local browser_cam.py --help

  publish-runtime:
    if: >-
      github.repository == 'ai-cfia/nachet' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    needs: [export-python-lint, export-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ai-cfia/nachet-export
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@5c62c5926145985eec91f09e2e0a75f40daed929
        with:
          version: "0.11.24"
          enable-cache: false

      - name: Read export image version
        id: version
        working-directory: mlops/export
        run: |
          version="$(uv version --short)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: mlops/export
          target: final
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=nachet-export

  sign-runtime:
    needs: publish-runtime
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-sign-container-images.yml
    with:
      image-name: ghcr.io/ai-cfia/nachet-export
      image-label: export runtime
      release-version: ${{ needs.publish-runtime.outputs.version }}
