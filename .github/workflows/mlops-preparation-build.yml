---
name: MLOps preparation build and publish

on:
  pull_request:
    types: [opened, reopened, closed, synchronize]
    paths:
      - "mlops/preparation/**"
      - "mlops/blob/**"
      - ".github/workflows/mlops-preparation-build.yml"
      - ".github/workflows/reusable-sign-container-images.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@5c62c5926145985eec91f09e2e0a75f40daed929
        with:
          version: "0.11.24"
          enable-cache: false
      - name: Read image version
        id: version
        working-directory: mlops/preparation
        env:
          RELEASE: ${{ github.event.pull_request.merged && github.base_ref == 'main' }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          version="$(uv version --short)"
          if [[ "$RELEASE" != "true" ]]; then version="$version-pr.$PR_NUMBER"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        target: [cpu, sam3, registration]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ai-cfia/nachet-preparation-${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
      - name: Log in to GHCR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve branch tag
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          clean_name="$(printf '%s' "$HEAD_REF" | sed 's#[/\\]#-#g')"
          echo "name=$clean_name" >> "$GITHUB_OUTPUT"
      - name: Build pull request image
        if: github.event.pull_request.merged == false
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: mlops
          file: mlops/preparation/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ github.event.number }}
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.branch.outputs.name }}
            ${{ env.IMAGE }}:${{ env.VERSION }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:cache-pr-amd64
            type=registry,ref=${{ env.IMAGE }}:cache-merged-amd64
          cache-to: >-
            ${{ github.event.pull_request.head.repo.full_name == github.repository &&
            format('type=registry,ref={0}:cache-pr-amd64,mode=min', env.IMAGE) || '' }}
      - name: Build merged image
        if: github.event.pull_request.merged == true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: mlops
          file: mlops/preparation/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.event.pull_request.base.ref }}
            ${{ env.IMAGE }}:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache-merged-amd64
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache-merged-amd64,mode=min

  sign:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: [version, build]
    strategy:
      matrix:
        target: [cpu, sam3, registration]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-sign-container-images.yml
    with:
      image-name: ghcr.io/ai-cfia/nachet-preparation-${{ matrix.target }}
      image-label: preparation ${{ matrix.target }} runtime
      release-version: ${{ needs.version.outputs.version }}
