name: Backend Build and Push

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-build.yml"
      - ".github/workflows/reusable-sign-container-images.yml"
    types:
      - opened
      - closed
      - synchronize

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# concurrency:
#   group: backend-build-${{ github.ref }}
#   cancel-in-progress: true

env:
  IS_MONOREPO: true
  BACKEND_PATH: backend
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nachet-backend

defaults:
  run:
    working-directory: backend

jobs:
  nachet-pyproject-version-bump:
    # if: github.event.pull_request.merged != true
    name: nachet-backend-pyproject-version-bump
    uses: ai-cfia/github-workflows/.github/workflows/workflow-version-bump-python-mono.yml@main
    secrets: inherit
    with:
      pyproject-path: "pyproject.toml"
      package-name: "nachet-backend"
      working-directory: backend

  get-version:
    needs: nachet-pyproject-version-bump
    runs-on: ubuntu-latest

    outputs:
      app-version: ${{ steps.versions.outputs.app-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git for GitHub Actions
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Action"

      - name: Validate and move pyproject.toml for build
        run: |
          if [ ! -f "pyproject.toml" ]; then
            echo "Error: pyproject.toml not found"
            exit 1
          fi

      - name: Parse version from pyproject.toml
        id: versions
        run: |
          if [ ! -f "pyproject.toml" ]; then
            echo "Error: pyproject.toml not found after move operation"
            exit 1
          fi
          version=$(grep -Po '(?<=^version = ")[^"]*' pyproject.toml)
          if [ -z "$version" ]; then
            echo "Error: Could not parse version from pyproject.toml"
            exit 1
          fi
          echo "Parsed version: $version"
          echo "app-version=$version" >> $GITHUB_OUTPUT

  build-and-push-gcr:
    needs: get-version
    # uses: ./.github/workflows/workflow-build-push-container-github-registry-mono.yml
    uses: ai-cfia/github-workflows/.github/workflows/workflow-build-push-container-github-registry-mono.yml@main
    with:
      working-directory: backend
      container-name: ${{ github.event.repository.name }}-backend
      tag: ${{ github.sha }}
      release-version: ${{ needs.get-version.outputs.app-version }}
      registry: ghcr.io/ai-cfia
    secrets: inherit

  sign-images:
    needs: [get-version, build-and-push-gcr]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-sign-container-images.yml
    with:
      image-name: ghcr.io/ai-cfia/${{ github.event.repository.name }}-backend
      image-label: backend
      release-version: ${{ needs.get-version.outputs.app-version }}
    secrets: inherit
