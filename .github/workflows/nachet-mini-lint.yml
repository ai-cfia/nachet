name: Nachet Mini Lint
permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "nachet-mini/**"
      - ".github/workflows/nachet-mini-*.yml"
    types:
      - opened
      - closed
      - synchronize
  push:
    branches:
      - main
    paths:
      - "nachet-mini/**"
      - ".github/workflows/nachet-mini-*.yml"

env:
  IS_MONOREPO: true
  FRONTEND_PATH: nachet-mini
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nachet-mini

defaults:
  run:
    working-directory: nachet-mini

jobs:
  versions:
    if: ${{ github.event.pull_request.user.login != 'renovate[bot]' }}
    uses: ./.github/workflows/reusable-frontend-versions.yml
    with:
      working-directory: nachet-mini
      package-name: nachet-mini
      skip-version-check: false

  check-package-lock:
    needs: [versions]
    if: ${{ !cancelled() && needs.versions.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nachet-mini
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.versions.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: nachet-mini/package-lock.json

      - name: Install specific npm version
        run: npm install -g npm@${{ needs.versions.outputs.npm-version }}

      - name: Check if package-lock.json is up to date
        run: |
          echo "🔍 Checking if package-lock.json needs updating..."

          cp package-lock.json package-lock.json.backup
          npm install --package-lock-only

          if ! cmp -s package-lock.json package-lock.json.backup; then
            echo "❌ package-lock.json is out of date!"
            echo ""
            echo "The package-lock.json file needs to be updated."
            echo "Please run 'npm install' locally and commit the updated package-lock.json file."
            echo ""
            echo "Differences found:"
            diff package-lock.json.backup package-lock.json || true
            exit 1
          else
            echo "✅ package-lock.json is up to date!"
          fi

  nachet-mini-lint-test:
    needs: [versions, check-package-lock]
    if: ${{ !cancelled() && needs.check-package-lock.result == 'success' }}
    uses: ai-cfia/github-workflows/.github/workflows/workflow-lint-test-node-mono.yml@main
    with:
      working-directory: nachet-mini
      node-version: ${{ needs.versions.outputs.node-version }}
      npm-version: ${{ needs.versions.outputs.npm-version }}
    secrets: inherit

  nachet-mini-browser-tests:
    name: Nachet Mini Browser Tests
    needs: [versions, nachet-mini-lint-test]
    if: ${{ !cancelled() && needs.nachet-mini-lint-test.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nachet-mini
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.versions.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: nachet-mini/package-lock.json

      - name: Install specific npm version
        run: npm install -g npm@${{ needs.versions.outputs.npm-version }}

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('nachet-mini/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Run browser tests
        run: npm run test:browser

  nachet-mini-accessibility:
    name: Nachet Mini Accessibility
    needs: [nachet-mini-browser-tests]
    if: ${{ !cancelled() && needs.nachet-mini-browser-tests.result == 'success' }}
    uses: ./.github/workflows/nachet-mini-accessibility.yml
    secrets: inherit

  sbom-security-scan:
    needs: [versions]
    uses: ai-cfia/github-workflows/.github/workflows/workflow-generate-frontend-sbom.yml@main
    with:
      working-directory: nachet-mini
    secrets: inherit

  markdown-check:
    needs: [versions]
    uses: ai-cfia/github-workflows/.github/workflows/workflow-markdown-check-mono.yml@main
    with:
      working-directory: nachet-mini
      md-link-config-file-path: ".mlc_config.json"
    secrets: inherit

  trigger-release:
    name: Trigger release workflow
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Trigger Release Workflow for Nachet Mini
        run: |
          gh workflow run nachet-mini-release.yml \
          --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
