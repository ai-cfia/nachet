name: blob module tests

permissions:
  contents: read
  pull-requests: write
  actions: write

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "backend/app/blob/**"
      - ".github/workflows/blob-*"
  push:
    branches:
      - main
    paths:
      - "backend/app/blob/**"
      - ".github/workflows/blob-*"

defaults:
  run:
    working-directory: backend/app/blob

jobs:
  test:
    runs-on: ubuntu-latest
    environment: datastore_ci
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@208b0c0ee42039b2cbf5fd3ca0ec7d6d8a49336f

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite Blob Storage Emulator
        shell: bash
        run: azurite --loose --blobHost 127.0.0.1 --blobPort 10000 &

      # - name: Wait for Azurite to be ready
      #   run: |
      #     timeout 30 bash -c 'until curl -f http://127.0.0.1:10000/ 2>/dev/null; do sleep 1; done'

      - name: Run tests
        run: |
          uv run pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing
        env:
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          BLOB_STORAGE_PROVIDER: ${{ secrets.BLOB_STORAGE_PROVIDER }}
          BLOB_STORAGE_NAME: ${{ secrets.BLOB_STORAGE_NAME }}
          BLOB_STORAGE_KEY: ${{ secrets.BLOB_STORAGE_KEY }}
          BLOB_STORAGE_ENDPOINT_PROTOCOL: ${{ secrets.BLOB_STORAGE_ENDPOINT_PROTOCOL }}
          BLOB_STORAGE_ENDPOINT_SUFFIX: ${{ secrets.BLOB_STORAGE_ENDPOINT_SUFFIX }}
          BLOB_STORAGE_ENDPOINT_BASE: ${{ secrets.BLOB_STORAGE_ENDPOINT_BASE }}

      # - name: Upload coverage to Codecov
      #   if: success()
      #   uses: codecov/codecov-action@v3
      #   with:
      #     file: ./datastore/coverage.xml
      #     flags: datastore
      #     name: datastore-coverage
