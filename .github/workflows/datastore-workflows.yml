---
name: datastore workflows

on:
  pull_request:
    types:
      - opened
      - closed
      - synchronize
    paths:
      - 'datastore/**'
      - 'nachet_pyproject.toml'
  push:
    branches:
      - main
    paths:
      - 'datastore/**'
      - 'nachet_pyproject.toml'

jobs:
  nachet-pyproject-version-bump:
    if: github.event.pull_request.merged != true
    name: nachet-datastore-pyproject-version-bump
    uses: ai-cfia/github-workflows/.github/workflows/workflow-version-bump-python-mono.yml@main
    secrets: inherit
    with:
      pyproject-path: 'nachet_pyproject.toml'
      package-name: 'nachet-datastore'
      working-directory: datastore
  datastore-lint:
    name: datastore-lint-test-python
    uses: ai-cfia/github-workflows/.github/workflows/workflow-lint-test-python-mono.yml@main
    secrets: inherit
    with:
      skip-coverage: 'true'
      working-directory: datastore
  # bytebase-sql-review:
  #   uses: ai-cfia/github-workflows/.github/workflows/workflow-bytebase-sql-review.yml@main
  #   secrets: inherit
  mkd-check:
    name: workflow-markdown-check
    uses: ai-cfia/github-workflows/.github/workflows/workflow-markdown-check-mono.yml@main
    secrets: inherit
    with:
      working-directory: datastore
      md-link-config-file-path: '.mlc_config.json'
  yaml-check:
    name: workflow-yaml-check
    uses: ai-cfia/github-workflows/.github/workflows/workflow-yaml-check-mono.yml@main
    secrets: inherit
    with:
      working-directory: datastore

  trigger-release:
    name: Trigger release workflow
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Trigger Release Workflow for Nachet Datastore
        run: |
          gh workflow run publish-package.yml \
          --ref main \
          -f package-name=nachet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
