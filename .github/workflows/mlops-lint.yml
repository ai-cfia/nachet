---
name: MLOps lint

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "mlops/training/**"
      - ".github/workflows/mlops-lint.yml"
  push:
    branches:
      - main
    paths:
      - "mlops/training/**"
      - ".github/workflows/mlops-lint.yml"
  workflow_dispatch:

jobs:
  training-python-lint:
    uses: ai-cfia/github-workflows/.github/workflows/workflow-lint-python-mono.yml@c504dacdff61c8a1f7c796934e9ad20749f6d136
    with:
      working-directory: mlops/training
