---
name: MLOps lint

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "mlops/training/**"
      - ".github/workflows/mlops-lint.yml"
  push:
    branches:
      - main
    paths:
      - "mlops/training/**"
      - ".github/workflows/mlops-lint.yml"
  workflow_dispatch:

jobs:
  training-python-lint:
    uses: ai-cfia/github-workflows/.github/workflows/workflow-lint-python-mono.yml@c504dacdff61c8a1f7c796934e9ad20749f6d136
    with:
      working-directory: mlops/training

  training-syntax:
    name: Check Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mlops/training

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The image build runs the full test suite with the runtime dependencies.
      - name: Check Python syntax
        run: python -m compileall -q ./*/src ./*/tests ./*.py
