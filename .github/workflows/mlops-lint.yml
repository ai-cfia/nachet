---
name: MLOps lint

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "mlops/training/**"
      - "mlops/export/**"
      - "mlops/datasets/**"
      - ".github/workflows/mlops-lint.yml"
  push:
    branches:
      - main
    paths:
      - "mlops/training/**"
      - "mlops/export/**"
      - "mlops/datasets/**"
      - ".github/workflows/mlops-lint.yml"
  workflow_dispatch:

jobs:
  dataset-release-checks:
    name: Validate dataset release tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mlops/datasets
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@5c62c5926145985eec91f09e2e0a75f40daed929
        with:
          version: "0.11.24"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check Python
        run: |
          uv run --no-sync ruff check dataset_release mlops_blob migrations tests
          uv run --no-sync ruff format --check dataset_release mlops_blob migrations tests
      - name: Test standalone release tools
        run: uv run --no-sync pytest

  training-python-lint:
    uses: ai-cfia/github-workflows/.github/workflows/workflow-lint-python-mono.yml@c504dacdff61c8a1f7c796934e9ad20749f6d136
    with:
      working-directory: mlops/training

  export-python-lint:
    uses: ai-cfia/github-workflows/.github/workflows/workflow-lint-python-mono.yml@c504dacdff61c8a1f7c796934e9ad20749f6d136
    with:
      working-directory: mlops/export

  training-syntax:
    name: Check Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mlops/training

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The image build runs the full test suite with the runtime dependencies.
      - name: Check Python syntax
        run: python -m compileall -q ./*/src ./*/tests ./*.py
