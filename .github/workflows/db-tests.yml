name: database module tests

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "backend/app/db/**"
      - ".github/workflows/db-*"
  push:
    branches:
      - main
    paths:
      - "backend/app/db/**"
      - ".github/workflows/db-*"

defaults:
  run:
    working-directory: backend/app/db

jobs:
  db-module-tests:
    runs-on: ubuntu-latest
    environment: datastore_ci
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite Blob Storage Emulator
        shell: bash
        run: azurite --loose --blobHost 127.0.0.1 --blobPort 10000 &

      # - name: Wait for Azurite to be ready
      #   run: |
      #     timeout 30 bash -c 'until curl -f http://127.0.0.1:10000/ 2>/dev/null; do sleep 1; done'

      - name: Alembic migration to repo head
        working-directory: backend/app/db
        run: |
          uv run db_setup_test.py
        env:
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: "${{ secrets.NACHET_SCHEMA }}"
          CFIA_ORGANIZATION_ID: ${{ secrets.CFIA_ORGANIZATION_ID }}
          CFIA_ADMIN_ROLE_ID: ${{ secrets.CFIA_ADMIN_ROLE_ID }}

      - name: Run tests
        run: |
          uv run pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing
        env:
          BACKEND_DEV_PORT: ${{ secrets.BACKEND_DEV_PORT }}
          ALEMBIC_MIGRATION_LOG_LEVEL: ${{ secrets.ALEMBIC_MIGRATION_LOG_LEVEL }}
          SQLALCHEMY_MIGRATION_LOG_LEVEL: ${{ secrets.SQLALCHEMY_MIGRATION_LOG_LEVEL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTING: "false"
          DEBUG: ${{ secrets.DEBUG }}
          NACHET_SCHEMA: "${{ secrets.NACHET_SCHEMA }}"
          CFIA_ORGANIZATION_ID: ${{ secrets.CFIA_ORGANIZATION_ID }}
          CFIA_ADMIN_ROLE_ID: ${{ secrets.CFIA_ADMIN_ROLE_ID }}

      # - name: Upload coverage to Codecov
      #   if: success()
      #   uses: codecov/codecov-action@v3
      #   with:
      #     file: ./datastore/coverage.xml
      #     flags: datastore
      #     name: datastore-coverage
