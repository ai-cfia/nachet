---
name: Secrets Scan Trufflehog
permissions:
  contents: read
  pull-requests: write
  actions: write

on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - main

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trufflehog
        uses: trufflesecurity/trufflehog@7ba7a0005dd18eae378c109c4080666819557cbc
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown
