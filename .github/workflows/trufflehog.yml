---
name: Secrets Scan Trufflehog
permissions:
  contents: read
  pull-requests: write
  actions: write

on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - main

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trufflehog
        uses: trufflesecurity/trufflehog@84d5a49ba45cf1d427d8d8fa6351280b56d440b1
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown
