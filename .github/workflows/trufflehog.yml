---
name: Secrets Scan Trufflehog
permissions:
  contents: read
  pull-requests: write
  actions: write

on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - main

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trufflehog
        uses: trufflesecurity/trufflehog@e88e7d019eb84ca64f6b768c82eb6bf1a6271401
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown
