name: Create Backend Release

# This workflow can be triggered in two ways:
# 1. Automatically by the backend-tests workflow when a PR is merged to main
# 2. Manually via workflow_dispatch for ad-hoc releases
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git for GitHub Actions
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Action"

      - name: Validate and move pyproject.toml for build
        run: |
          if [ ! -f "pyproject.toml" ]; then
            echo "Error: pyproject.toml not found"
            exit 1
          fi

      - name: Parse version from pyproject.toml
        id: versions
        run: |
          if [ ! -f "pyproject.toml" ]; then
            echo "Error: pyproject.toml not found after move operation"
            exit 1
          fi
          version=$(grep -Po '(?<=^version = ")[^"]*' pyproject.toml)
          if [ -z "$version" ]; then
            echo "Error: Could not parse version from pyproject.toml"
            exit 1
          fi
          echo "Parsed version: $version"
          echo "app-version=$version" >> $GITHUB_OUTPUT

      - name: Switch to the release branch
        run: |
          branch_name="release/nachet-backend-v${{ steps.versions.outputs.app-version }}"

          # Check if branch exists locally and delete it
          if git show-ref --verify --quiet refs/heads/$branch_name; then
            echo "Branch $branch_name exists locally, deleting it"
            git branch -D $branch_name
          fi

          # Check if branch exists remotely and delete it
          if git ls-remote --heads origin $branch_name | grep -q $branch_name; then
            echo "Branch $branch_name exists remotely, deleting it"
            git push origin --delete $branch_name
          fi

          # Create and push new branch
          git checkout -b $branch_name
          git push -u origin $branch_name

      - name: Remove unnecessary files from release branch
        working-directory: .
        run: |
          echo "Files and directories before cleanup:"
          find . -maxdepth 2 -type f -o -type d | head -20

          # Validate required directories exist before cleanup
          if [ ! -d "./backend" ]; then
            echo "Error: Required directory backend not found"
            exit 1
          fi

          # Remove files (excluding protected ones)
          echo "Removing unnecessary files..."
          find . -path "./.git" -prune -o -type f ! -name "pyproject.toml" ! -name "requirements.txt" ! -path "./backend/*" -print -exec rm -f {} +

          # Remove directories (excluding protected ones) 
          echo "Removing unnecessary directories..."
          find . -type d \( -path "./.git" -o -path "./backend" \) -prune -o -type d ! -path "." -print -exec rm -rf {} +

          echo "Files and directories after cleanup:"
          find . -maxdepth 2 -type f -o -type d | head -20

      - uses: EndBug/add-and-commit@2df77c10fb02f084460f06c7d7a576a43bd00b86
        with:
          message: "Release nachet-backend-v${{ steps.versions.outputs.app-version }}"
          add: "."
          author_name: "GitHub Action"
          author_email: actions@github.com

      - name: Tag the clean version on the release branch
        run: |
          tag_name="nachet-backend-v${{ steps.versions.outputs.app-version }}"

          # Check if tag exists locally and delete it
          if git tag -l | grep -q "^$tag_name$"; then
            echo "Tag $tag_name exists locally, deleting it"
            git tag -d $tag_name
          fi

          # Check if tag exists remotely and delete it
          if git ls-remote --tags origin | grep -q "refs/tags/$tag_name$"; then
            echo "Tag $tag_name exists remotely, deleting it"
            git push --delete origin refs/tags/$tag_name
          fi

          # Create and push new tag
          git tag -a $tag_name -m "Release ${{ steps.versions.outputs.app-version }}"
          git push origin refs/tags/$tag_name

      - name: Generate changelog from PRs since last backend tag
        id: generate_changelog
        run: |
          # Fetch the latest backend tag as a reference
          latest_tag=$(git tag -l "nachet-backend-v*" | sort -V | tail -n 1 2>/dev/null || echo "")

          if [ -z "$latest_tag" ]; then
            echo "No previous backend tags found, generating changelog from beginning of history"
            latest_tag_date="\"1970-01-01T00:00:00Z\""
          else
            echo "Found latest backend tag: $latest_tag"
            # Format date for jq comparison
            latest_tag_date=$(git log -1 --format=%ai "$latest_tag" | sed 's/.*/"&"/')
          fi

          backend_changelog=""

          # Fetch merged PRs since the latest tag
          echo "Fetching merged PRs since $latest_tag_date"
          pr_list=$(gh pr list --repo $GITHUB_REPOSITORY --state merged --json number,title,url,mergedAt --jq ".[] | select(.mergedAt > $latest_tag_date) | .number" 2>/dev/null || echo "")

          if [ -z "$pr_list" ]; then
            echo "No merged PRs found since latest tag"
          else
            echo "Found PRs: $pr_list"
          fi

          for pr in $pr_list; do
            echo "Processing PR #$pr"
            files=$(gh pr view "$pr" --repo $GITHUB_REPOSITORY --json files --jq '.files[].path' 2>/dev/null || echo "")
            
            if [ -z "$files" ]; then
              echo "Warning: Could not fetch files for PR #$pr, skipping"
              continue
            fi

            if echo "$files" | grep -q "^backend/"; then
              pr_info=$(gh pr view "$pr" --repo $GITHUB_REPOSITORY --json title,url | jq -r '"- \(.title) (\(.url))"')
              backend_changelog="$backend_changelog\n$pr_info"
            fi
          done

          changelog="## backend Changes\n"

          if [ -n "$backend_changelog" ]; then
            changelog="$changelog$backend_changelog"
          else
            changelog="$changelog\n- No backend-specific changes found in recent PRs"
          fi

          # Print changelog for debugging
          echo "Generated changelog:"
          echo -e "$changelog"

          # Output changelog content to GitHub Actions output for use in release step
          echo "release_body<<EOF" >> $GITHUB_OUTPUT
          echo -e "$changelog" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@89bab4d0a786b1d8c582ff85606edc1d68164af5
        with:
          tag: "nachet-backend-v${{ steps.versions.outputs.app-version }}"
          name: "nachet-backend v${{ steps.versions.outputs.app-version }}"
          body: "${{ steps.generate_changelog.outputs.release_body }}"
          allowUpdates: true
          generateReleaseNotes: false
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
