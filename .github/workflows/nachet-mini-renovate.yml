name: Nachet Mini Renovate

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "nachet-mini/**"
      - ".github/workflows/nachet-mini-*.yml"
      - ".github/workflows/reusable-frontend-versions.yml"
    types:
      - opened
      - synchronize
      - reopened

defaults:
  run:
    working-directory: nachet-mini

jobs:
  versions:
    if: ${{ github.actor == 'renovate[bot]' }}
    uses: ./.github/workflows/reusable-frontend-versions.yml
    with:
      working-directory: nachet-mini
      package-name: nachet-mini
      skip-version-check: true

  bump-version:
    name: Bump version
    needs: [versions]
    if: ${{ !cancelled() && needs.versions.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.versions.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: nachet-mini/package-lock.json

      - name: Install specific npm version
        run: npm install -g npm@${{ needs.versions.outputs.npm-version }}

      - name: Idempotently bump version
        run: |
          latest_version=""
          tags=$(git tag --list "nachet-mini-v*" --sort=-creatordate | head -n 10)

          for tag in $tags; do
            version=$(echo "$tag" | grep -oP '(?<=nachet-mini-v)[0-9]+\.[0-9]+\.[0-9]+')
            if [ -n "$version" ]; then
              latest_version="$version"
              break
            fi
          done

          if [ -z "$latest_version" ]; then
            latest_version="0.0.0"
          fi

          current_version=$(jq -r '.version' package.json)
          desired_version=$(echo "$latest_version" | awk -F. -v OFS=. '{ $NF++; print }')

          compare_versions() {
            local version1=$1
            local version2=$2

            IFS='.' read -ra V1 <<< "$version1"
            IFS='.' read -ra V2 <<< "$version2"

            for i in {0..2}; do
              v1_part=${V1[i]:-0}
              v2_part=${V2[i]:-0}

              if [ "$v1_part" -gt "$v2_part" ]; then
                return 0
              elif [ "$v1_part" -lt "$v2_part" ]; then
                return 1
              fi
            done

            return 1
          }

          echo "Latest released version: $latest_version"
          echo "Current PR version: $current_version"
          echo "Desired PR version: $desired_version"

          if compare_versions "$current_version" "$latest_version"; then
            echo "Version is already bumped."
          else
            npm version "$desired_version" --no-git-tag-version
          fi

      - name: Update lock file
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only || true

      - name: Check if bump is needed
        id: check
        run: |
          git diff --exit-code || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & push changes
        if: steps.check.outputs.changed == 'true'
        uses: EndBug/add-and-commit@ebe9b51bb11d033d228e1a1c3f23ad5bd4110c81
        with:
          message: "chore: bump nachet-mini version for Renovate PRs"
          add: "."
          pull: "--rebase --autostash"
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"
