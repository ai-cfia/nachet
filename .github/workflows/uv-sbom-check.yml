---
name: uv venv sbom check

permissions:
  contents: write
  pull-requests: write

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."

jobs:
  check-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@04224aa8caab79e9c08d41c1ef06d6394aafe6a0

      - name: Install dependencies and cyclone-x
        run: |
          uv sync --group dev --group sbom

      - name: Generate new SBOM
        run: |
          uv run cyclonedx-py environment --output-reproducible -v --sv 1.6 \
            --pyproject pyproject.toml -o sbom-new.json && echo "" >> sbom-new.json

      - name: Check if SBOM needs update
        id: sbom-check
        run: |
          if [ ! -f sbom.json ]; then
            echo "SBOM file does not exist and needs to be generated"
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "## SBOM Creation Required" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The SBOM file (sbom.json) does not exist and needs to be generated." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run the following command to create it:" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo 'cd nachet && ./generate-sbom.sh ${{ inputs.working-directory }} ' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          elif ! cmp -s sbom.json sbom-new.json; then
            echo "SBOM file is outdated and needs to be regenerated"
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "## SBOM Update Required" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The SBOM file (sbom.json) is outdated and " \
              "needs to be regenerated." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run the following command to update it:" \
              >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo 'cd nachet && ./generate-sbom.sh ${{ inputs.working-directory }} ' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "SBOM file is up to date"
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "## SBOM Status" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ SBOM file is up to date" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Show diff if needed
        if: steps.sbom-check.outputs.needs_update == 'true'
        run: |
          echo "Differences between current and expected SBOM:"
          diff sbom.json sbom-new.json || true

      - name: Update SBOM if needed
        if: steps.sbom-check.outputs.needs_update == 'true'
        run: |
          echo "Replacing sbom.json with sbom-new.json and committing"
          mv sbom-new.json sbom.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sbom.json
          git commit -m "chore(sbom): update backend sbom.json" || echo "No changes to commit"
          # Determine target branch for push (handle detached HEAD)
          if [ -n "${GITHUB_HEAD_REF:-}" ]; then
            TARGET_BRANCH="$GITHUB_HEAD_REF"
          elif [[ "${GITHUB_REF:-}" == refs/heads/* ]]; then
            TARGET_BRANCH="${GITHUB_REF#refs/heads/}"
          else
            TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || true)
            if [ "$TARGET_BRANCH" = "HEAD" ] || [ -z "$TARGET_BRANCH" ]; then
              TARGET_BRANCH="${GITHUB_REF#refs/heads/}"
            fi
          fi
          TARGET_BRANCH=${TARGET_BRANCH:-main}
          echo "Pushing commit to branch: $TARGET_BRANCH"
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}" || {
            echo "Push failed" 
            exit 126
            }
          else
            GIT_TERMINAL_PROMPT=0 git push origin "HEAD:refs/heads/${TARGET_BRANCH}" || {
              echo "Push skipped or failed (no token available)"
              exit 126
            }
          fi