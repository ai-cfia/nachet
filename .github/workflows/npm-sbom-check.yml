---
name: npm node sbom check

permissions:
  contents: write
  pull-requests: write

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."
      node-version:
        required: false
        type: string
        default: "24.5.0"
      npm-version:
        required: false
        type: string
        default: "11.5.1"

jobs:
  check-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          # For PRs, checkout the PR branch so we can push fixes back.
          ref: ${{ github.head_ref || github.ref }}

      - name: Apply latest patches
        run: |
          sudo apt update && sudo apt upgrade -y

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: >-
            ${{ inputs.working-directory }}/package-lock.json

      - name: Install specific npm version
        run: npm install -g npm@${{ inputs.npm-version }}

      - name: Install dependencies
        run: npm ci

      - name: Generate new SBOM
        run: |
          npx cyclonedx-npm package-lock.json \
            --output-reproducible \
            --package-lock-only \
            -v \
            --sv 1.6 \
            -o sbom-new.json \
          && echo "" >> sbom-new.json

      - name: Check if SBOM needs update
        id: sbom-check
        run: |
          if [ ! -f sbom.json ]; then
            echo "SBOM file does not exist and needs to be generated"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          elif ! cmp -s sbom.json sbom-new.json; then
            # HACK: cyclonedx-npm --output-reproducible is not reproducible
            # due to non-deterministic BOM-REF generation and component ordering
            # Filter out BOM-REF differences and only count meaningful changes.
            diff_lines=$(
              diff sbom.json sbom-new.json \
                | grep -v "bom-ref\|BomRef\|content.*:" \
                | wc -l
            )
            if [ "$diff_lines" -gt 100 ]; then
              echo "SBOM file is outdated and needs to be regenerated" \
                "(significant changes: $diff_lines lines)"
              echo "needs_update=true" >> $GITHUB_OUTPUT
            else
              echo "SBOM file has minor differences" \
                "($diff_lines lines) within tolerance"
              echo "needs_update=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "SBOM file is up to date"
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Show diff if needed
        if: steps.sbom-check.outputs.needs_update == 'true'
        run: |
          echo "Differences between current and expected SBOM:"
          diff sbom.json sbom-new.json || true

      - name: Fail if SBOM needs update but couldn't auto-fix
        if: steps.sbom-check.outputs.needs_update == 'true' && steps.sbom-check.outputs.updated != 'true'
        run: |
          echo "SBOM file is outdated and needs to be regenerated." \
            "Please run the SBOM generation script locally and push the updated sbom.json." >&2
          exit 1
