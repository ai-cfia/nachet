global-components:
  - "src/components/**/*.tsx"
  - "src/pages/**/*.tsx"

global-libraries:
  - "react"
  - "react-dom"
  - "@mui/material"
  - "@mui/icons-material"
  - "@emotion/react"
  - "@emotion/styled"

rules:
  wcag-2.0-a: true
  wcag-2.0-aa: true
  wcag-2.1-a: true
  wcag-2.1-aa: true
  wcag-2.2-aa: true
  best-practice: true

builtins:
  - react

include:
  - "nachet-mini/src/**/*.tsx"
  - "nachet-mini/src/**/*.jsx"
  - "frontend/src/**/*.tsx"
  - "frontend/src/**/*.jsx"

exclude:
  - "nachet-mini/node_modules/**"
  - "nachet-mini/dist/**"
  - "nachet-mini/coverage/**"
  - "nachet-mini/src/**/tests/**"
  - "nachet-mini/src/**/*.test.tsx"
  - "nachet-mini/src/**/*.test.ts"
  - "nachet-mini/src/**/__screenshots__/**"
  - "frontend/node_modules/**"
  - "frontend/dist/**"
  - "frontend/build/**"
  - "frontend/coverage/**"
  - "frontend/src/**/tests/**"
  - "frontend/src/**/__tests__/**"
  - "frontend/src/**/*.test.tsx"
  - "frontend/src/**/*.test.ts"
  - "frontend/src/**/__screenshots__/**"
